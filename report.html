<script>
const SAMPLE_DATA = {
  meta:{id:"FSA-2025-0047",date:"14 May 2025",assessorName:"J. Davies MIFPO",assessorQuals:"MIFPO, NEBOSH Fire Certificate, FPA Graduate",assessorContact:"j.davies@firesiteapp.co.uk",clientName:"Acme Properties Ltd",nextReviewDate:"May 2026",dclgGuide:"Offices and Shops"},
  premises:{address:"Unit 4, Station Road Industrial Estate\nCardiff, CF24 5AB",use:"Light industrial workshop with first-floor offices (mixed use)",floors:"2",area:"Approx. 850 m\u00B2",maxOccupancy:"21\u201350",construction:"1980s steel-framed, brick infill, flat asphalt roof",buildingHeight18m:false,hasBasement:false,sleepingRisk:false,listedBuilding:false,previousFRA:true,previousFRADate:"June 2022",responsiblePerson:"Mr David Hughes, Operations Manager",rpContact:"07700 900123 / d.hughes@acme.co.uk",rpTrained:true},
  overallRisk:"medium",
  riskJustification:"The premises presents a MEDIUM level of fire risk. The general housekeeping and fuel load management is satisfactory in most areas. However, deficiencies have been identified relating to the lack of an active PAT testing programme, absence of a current EICR, a partially obstructed escape corridor, and fire alarm call point testing records that are incomplete. One fire door self-closer was found inoperative on the first-floor landing. These matters are addressed in the Action Plan and must be resolved within the timescales indicated. The overall risk level is not tolerable until the P1 and P2 actions are resolved.",
  findings:[
    {ref:"1.9",section:"Ignition Sources & Fuel Load",question:"Is the building kept reasonably free from accumulated waste and unnecessary combustible material?",answer:"no",comment:"A significant accumulation of flattened cardboard packaging was observed in the first-floor plant room corridor, stacked to approximately 1.2m in height. Combustible materials including cardboard cartons and plastic wrap were also stored directly adjacent to the main distribution board within storeroom 3. These constitute an unnecessary fuel load in close proximity to an ignition source and must be removed immediately.",flagged:true,photos:[{id:"IMG_001",caption:"Cardboard accumulation in plant room corridor, first floor"},{id:"IMG_002",caption:"Combustible materials adjacent to distribution board, storeroom 3"}],guidance:"RRO Art.8 / DCLG Offices & Shops Pt.2 §1.1 / PAS 79-1 §8.3"},
    {ref:"2.1",section:"Electrical Safety",question:"Are portable electrical appliances subject to a regular programme of inspection and testing (PAT)?",answer:"no",comment:"No portable appliance testing programme is in place. Multiple portable appliances observed in use throughout both floors including a kettle, microwave oven, two desktop fans and several phone chargers. The responsible person confirmed that no PAT testing has ever been carried out. Formal PAT testing should be introduced at a frequency appropriate to the risk, in accordance with the IET Code of Practice 5th Edition.",flagged:true,photos:[{id:"IMG_003",caption:"Multiple portable appliances in use without PAT records, first-floor office"}],guidance:"RRO Art.17 / DCLG §2.1 / IET CoP 5th Ed / PAS 79-1 §8.4"},
    {ref:"2.3",section:"Electrical Safety",question:"Is the fixed electrical installation tested periodically by a competent electrical engineer?",answer:"no",comment:"No Electrical Installation Condition Report (EICR) could be produced for inspection. The responsible person confirmed uncertainty as to when the installation was last formally tested. Industrial premises of this type should be subject to periodic inspection at intervals not exceeding 3 years (BS 7671 / IET Wiring Regulations). Given the age of the building (circa 1980s) and the industrial use, an EICR should be obtained as a matter of priority.",flagged:true,photos:[],guidance:"RRO Art.17 / BS 7671:2018+A2 / DCLG §2.2 / PAS 79-1 §8.4"},
    {ref:"3.5",section:"Fire Doors",question:"Are all fire door self-closing devices in full working order, closing and latching from any open position?",answer:"no",comment:"The self-closing device to the FD30S door on the first-floor landing was found to be inoperative. The door was observed to stop approximately 150mm short of the frame when released from the 90 degree position, failing to latch. This renders the fire door ineffective. Immediate remedial action is required.",flagged:true,photos:[{id:"IMG_004",caption:"Inoperative self-closer — first floor landing fire door, failing to latch from 90 degrees"}],guidance:"BS 9999:2017 §21 / ADB Vol.2 B1 / BS EN 1154 / PAS 79-1 §8.7"},
    {ref:"7.7",section:"Means of Escape",question:"Are all escape routes and corridors free from obstructions at all times?",answer:"no",comment:"A roller-cage stock trolley was found partially obstructing the ground-floor escape corridor adjacent to the goods loading entrance, reducing the effective clear width to approximately 700mm at the narrowest point. The minimum clear width for this escape route serving up to 50 persons should be maintained at not less than 1000mm at all times.",flagged:true,photos:[{id:"IMG_005",caption:"Roller-cage trolley obstructing ground floor escape corridor — approx 700mm clear width observed"}],guidance:"RRO Art.14 / ADB Vol.2 B1 §3.27 / BS 9999:2017 §22.1 / DCLG §3.1"},
    {ref:"8.9",section:"Fire Alarm System",question:"Is a weekly fire alarm call point test being carried out and recorded in a fire safety log?",answer:"no",comment:"Weekly call point test records were not produced for inspection. The responsible person stated that testing is carried out occasionally but acknowledged that no formal records are kept. Under BS 5839-1:2017 and the RRO 2005, weekly functional tests of at least one call point must be conducted and recorded.",flagged:true,photos:[],guidance:"BS 5839-1:2017 §45.2 / RRO Art.17 / PAS 79-1 §8.8 / DCLG §4.2"},
    {ref:"6.2",section:"Fire Safety Management",question:"Have all staff received appropriate fire safety awareness training?",answer:"no",comment:"The responsible person confirmed that formal fire safety induction training was last provided in 2021. Three members of staff employed since that date have received no formal fire safety training.",flagged:true,photos:[],guidance:"RRO Art.21 / DCLG §6.1 / PAS 79-1 §8.9"},
    {ref:"P1.1",section:"Premises Details",question:"State the full address of the premises under assessment.",answer:"text",comment:"Unit 4, Station Road Industrial Estate, Cardiff, CF24 5AB",flagged:false,photos:[],guidance:""},
    {ref:"R2.1",section:"Responsible Person",question:"State the name of the Responsible Person as defined under Article 3 of the RRO 2005.",answer:"text",comment:"Mr David Hughes, Operations Manager, Acme Properties Ltd",flagged:false,photos:[],guidance:""},
    {ref:"9.4",section:"Firefighting Equipment",question:"Are portable fire extinguishers of the correct type and in the correct locations?",answer:"not_assessed",comment:"",flagged:false,photos:[],guidance:""}
  ]

const SMART_ACTIONS = {
  "3.5":{action:"Replace inoperative self-closing device to fire door on first-floor landing as a matter of immediate urgency. The door must achieve full close and latch from any position up to and including 90 degrees under its own power, in accordance with BS EN 1154. Until repaired, do not prop or hold open.",priority:"p1",guidance:"PAS 79-1:2020 §8.7 / BS EN 1154 / BS 9999:2017 §21 / ADB Vol.2 B1"},

  "8.9":{action:"Establish a weekly fire alarm call point test programme immediately. Record date, time, zone tested, and tester name in the fire safety log. Arrange a 6-monthly service inspection by a competent contractor certificated to BS 5839-1.",priority:"p2",guidance:"PAS 79-1:2020 §8.8 / BS 5839-1:2017 §45.2 / RRO Art.17 / DCLG §4.2"},
  "6.2":{action:"Arrange fire safety awareness training for all staff, with priority for the three individuals employed since 2021. Incorporate fire safety awareness into the induction programme for all new starters.",priority:"p3",guidance:"PAS 79-1:2020 §8.9 / RRO Art.21 / DCLG §6.1"}

const PRIORITY_ORDER = {p1:0,p2:1,p3:2,p4:3};

function getPhotoIndexData(findings){const photos=[];findings.forEach(f=>{(f.photos||[]).forEach(p=>{photos.push({...p,ref:f.ref,section:f.section});});});return photos;}
function actionPlanRows(findings){return findings.filter(f=>f.flagged).map(f=>{const s=SMART_ACTIONS[f.ref];return{ref:f.ref,section:f.section,finding:f.comment||f.question,action:s?s.action:"Review and implement appropriate corrective measures.",guidance:s?s.guidance:(f.guidance||""),priority:s?s.priority:"p3",photos:f.photos||[]};}).sort((a,b)=>(PRIORITY_ORDER[a.priority]||3)-(PRIORITY_ORDER[b.priority]||3));}
function riskClass(r){return(r||"").toLowerCase();}
function riskLabel(r){const m={high:"HIGH RISK",medium:"MEDIUM RISK",low:"LOW RISK",tolerable:"TOLERABLE"};return m[(r||"").toLowerCase()]||r||"\u2014";}
function chipClass(a){if(a==="yes")return"yes";if(a==="no")return"no";if(a==="na")return"na";if(a==="yna")return"yna";if(a==="not_assessed")return"na2";return"txt";}
function chipLabel(a){if(a==="yes")return"YES";if(a==="no")return"NO";if(a==="na")return"N/A";if(a==="yna")return"YES/NA";if(a==="not_assessed")return"Not assessed";return a||"\u2014";}
function pBadge(p){const labels={p1:"P1 \u2014 Immediate",p2:"P2 \u2014 1 Month",p3:"P3 \u2014 3 Months",p4:"P4 \u2014 12 Months"};return `<span class="pbadge ${p}">${labels[p]||p}</span>`;}
function esc(s){return(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function nl2br(s){return esc(s||"").replace(/\n/g,"<br>");}

function renderReport(data){
  const A=data;
  const allPhotos=getPhotoIndexData(A.findings||[]);
  const actionRows=actionPlanRows(A.findings||[]);
  const p=A.premises||{};
  const sections={};
  (A.findings||[]).forEach(f=>{if(!sections[f.section])sections[f.section]=[];sections[f.section].push(f);});

  const coverPage=`<div class="page cover"><div class="cover-bar"></div><div class="cover-inner"><div class="cover-logo-row"><img class="cover-logo-img" src="https://raw.githubusercontent.com/BluejaiAA/Firesite/main/firesite_logo.png" onerror="this.style.display='none'" alt="Firesite logo"><div><div class="cover-logo-name">Fire<em>site</em></div><div class="cover-logo-tagline">by Bluejai &nbsp;\u00B7&nbsp; Professional fire risk assessments, in your pocket</div></div></div><div class="cover-doc-type">Fire Risk Assessment Report</div><div class="cover-main-title">Fire Risk<br>Assessment</div><div class="cover-address">${nl2br(p.address||"\u2014")}</div><div class="cover-divider"></div><div class="cover-risk ${riskClass(A.overallRisk)}">&\#9632; ${riskLabel(A.overallRisk)}</div><div class="cover-meta"><span class="cm-lbl">Report Ref</span><span class="cm-val">${esc(A.meta?.id||"\u2014")}</span><span class="cm-lbl">Assessment Date</span><span class="cm-val">${esc(A.meta?.date||"\u2014")}</span><span class="cm-lbl">Assessor</span><span class="cm-val">${esc(A.meta?.assessorName||"\u2014")}</span><span class="cm-lbl">Qualifications</span><span class="cm-val">${esc(A.meta?.assessorQuals||"\u2014")}</span><span class="cm-lbl">Client</span><span class="cm-val">${esc(A.meta?.clientName||"\u2014")}</span><span class="cm-lbl">Resp. Person</span><span class="cm-val">${esc(p.responsiblePerson||"\u2014")}</span><span class="cm-lbl">Next Review</span><span class="cm-val">${esc(A.meta?.nextReviewDate||"Within 12 months")}</span><span class="cm-lbl">DCLG Guide</span><span class="cm-val">${esc(A.meta?.dclgGuide||"\u2014")}</span><span class="cm-lbl">Actions Raised</span><span class="cm-val">${actionRows.length} (${actionRows.filter(x=>x.priority==="p1").length} immediate, ${actionRows.filter(x=>x.priority==="p2").length} within 1 month)</span><span class="cm-lbl">Photos</span><span class="cm-val">${allPhotos.length} image${allPhotos.length===1?"":"s"} attached</span></div><div class="cover-foot"><div class="cover-foot-text">This report has been prepared by ${esc(A.meta?.assessorName||"\u2014")} on behalf of ${esc(A.meta?.clientName||"\u2014")} in accordance with the Regulatory Reform (Fire Safety) Order 2005 and PAS 79-1:2020.</div><div class="cover-foot-stds">Standards: RRO 2005 \u00B7 PAS 79-1:2020 \u00B7 ADB (2019) \u00B7 BS 9999:2017 \u00B7 BS 5839-1:2017 \u00B7 BS 5266-1:2016 \u00B7 Building Safety Act 2022 \u00B7 DCLG Guide: ${esc(A.meta?.dclgGuide||"applicable premises type")}</div></div></div></div>`;

  const premisesPage=`<div class="page"><div class="page-accent"></div><div class="rh"><div class="rh-logo">Fire<em>site</em></div><div class="rh-addr">${nl2br(p.address||"\u2014")}<br>${esc(A.meta?.id||"")}</div></div><div class="page-body"><div class="exec-box"><div class="exec-label">Executive Summary</div><div class="exec-text">${esc(A.riskJustification||"No summary available.")}</div></div><div class="sh"><div class="sh-num">A</div><div class="sh-text">Premises Details</div><div class="sh-rule"></div></div><table class="dtable"><tr><td class="lbl">Address</td><td class="val">${nl2br(p.address||"\u2014")}</td></tr><tr><td class="lbl">Primary Use</td><td class="val">${esc(p.use||"\u2014")}</td></tr><tr><td class="lbl">Floors / Area</td><td class="val">${esc(p.floors||"\u2014")} floor(s) &nbsp;\u00B7&nbsp; ${esc(p.area||"\u2014")}</td></tr><tr><td class="lbl">Max Occupancy</td><td class="val">${esc(p.maxOccupancy||"\u2014")}</td></tr><tr><td class="lbl">Construction</td><td class="val">${esc(p.construction||"\u2014")}</td></tr><tr><td class="lbl">Over 18m Height</td><td class="val">${p.buildingHeight18m?"YES \u2014 Building Safety Act 2022 applies":"No"}</td></tr><tr><td class="lbl">Basement Level(s)</td><td class="val">${p.hasBasement?"Yes":"None identified"}</td></tr><tr><td class="lbl">Sleeping Risk</td><td class="val">${p.sleepingRisk?"YES \u2014 sleeping accommodation present":"No sleeping accommodation"}</td></tr><tr><td class="lbl">Listed Building</td><td class="val">${p.listedBuilding?"Yes":"No"}</td></tr><tr><td class="lbl">Previous FRA</td><td class="val">${p.previousFRA?("Yes \u2014 "+esc(p.previousFRADate||"date not stated")):"No previous assessment identified"}</td></tr></table><div class="sh"><div class="sh-num">B</div><div class="sh-text">Responsible Person</div><div class="sh-rule"></div></div><table class="dtable"><tr><td class="lbl">Name &amp; Title</td><td class="val">${esc(p.responsiblePerson||"\u2014")}</td></tr><tr><td class="lbl">Contact</td><td class="val">${esc(p.rpContact||"\u2014")}</td></tr><tr><td class="lbl">Fire Safety Training</td><td class="val">${p.rpTrained?"Evidence of training reviewed":"No evidence of training \u2014 see Action Plan"}</td></tr></table></div><div class="rf"><span class="rf-text">OFFICIAL FIRE RISK ASSESSMENT REPORT \u2014 ${esc(A.meta?.id||"")} \u2014 ${esc(A.meta?.date||"")}</span><span class="rf-pgnum">Page 2</span></div></div>`;

  let findingsHtml="";let secIdx=0;
  Object.keys(sections).forEach(secName=>{
    secIdx++;
    findingsHtml+=`<div class="sh"><div class="sh-num">${secIdx}</div><div class="sh-text">${esc(secName)}</div><div class="sh-rule"></div></div>`;
    sections[secName].forEach(f=>{
      const isNA=f.answer==="not_assessed";
      findingsHtml+=`<div class="finding"><div class="finding-head"><span class="fref${f.flagged?" flagged":""}">${esc(f.ref)}</span><span class="fq">${esc(f.question)}</span><span class="chip ${chipClass(f.answer)}">${chipLabel(f.answer)}</span></div><div class="finding-body">${isNA?`<div class="na-note">Not assessed during this inspection.</div>`:(f.comment?`<div class="comment-lbl">Assessor's Comments</div><div class="comment-txt">${nl2br(f.comment)}</div>`:"")}${f.flagged?`<div class="flag-tag">&#9873; Raised in Action Plan</div>`:""}${(f.photos||[]).length>0?`<div class="photo-strip">${f.photos.map(ph=>`<div class="photo-placeholder"><div class="photo-placeholder-icon">\uD83D\uDCF7</div><div class="photo-ref-label">${esc(ph.id)}<br><span style="color:#C9D1D9;font-size:5pt;">${esc(ph.caption)}</span></div></div>`).join("")}</div>`:""}</div></div>`;
    });
  });

  const findingsPage=`<div class="page"><div class="page-accent"></div><div class="rh"><div class="rh-logo">Fire<em>site</em></div><div class="rh-addr">${nl2br(p.address||"\u2014")}<br>${esc(A.meta?.id||"")}</div></div><div class="page-body"><div class="sh" style="margin-top:0"><div class="sh-num" style="background:#6B7280">\u2736</div><div class="sh-text">Assessment Findings</div><div class="sh-rule"></div></div>${findingsHtml}</div><div class="rf"><span class="rf-text">OFFICIAL FIRE RISK ASSESSMENT REPORT \u2014 ${esc(A.meta?.id||"")} \u2014 ${esc(A.meta?.date||"")}</span><span class="rf-pgnum">Page 3</span></div></div>`;

  const actionRowsHtml=actionRows.map(row=>`<tr><td><div class="aref">${esc(row.ref)}</div><div style="font-family:'Nunito',sans-serif;font-size:5.5pt;color:#9CA3AF">${esc(row.section)}</div></td><td style="font-size:6.5pt;color:#374151">${esc(row.finding.substring(0,180)+(row.finding.length>180?"\u2026":""))}</td><td style="font-size:6.5pt;color:#111827">${esc(row.action)}</td><td><span class="guidance-ref">${esc(row.guidance)}</span></td><td>${pBadge(row.priority)}</td><td>${(row.photos||[]).length>0?row.photos.map(ph=>`<div class="photo-placeholder" style="width:18mm;height:14mm;margin-bottom:1mm"><div style="font-size:12px;color:#D1D5DB">\uD83D\uDCF7</div><div class="photo-ref-label" style="font-size:5pt">${esc(ph.id)}</div></div>`).join(""):`<span style="font-family:'Nunito',sans-serif;font-size:6pt;color:#D1D5DB">\u2014</span>`}</td></tr>`).join("");

  const actionPage=`<div class="page"><div class="page-accent"></div><div class="rh"><div class="rh-logo">Fire<em>site</em></div><div class="rh-addr">${nl2br(p.address||"\u2014")}<br>${esc(A.meta?.id||"")}</div></div><div class="page-body"><div class="sh" style="margin-top:0"><div class="sh-num" style="background:linear-gradient(135deg,#C0392B,#E67E22)">!</div><div class="sh-text">Action Plan</div><div class="sh-rule"></div></div><p style="font-size:7.5pt;color:#6B7280;margin-bottom:3mm;font-family:'Nunito',sans-serif;">Actions listed in priority order. Prepared in accordance with PAS 79-1:2020, ADB, BS 9999:2017, BS 5839-1:2017 and the DCLG guide (${esc(A.meta?.dclgGuide||"\u2014")}). The Responsible Person must ensure completion within stated timescales.</p><table class="atable"><colgroup><col class="col-ref"><col class="col-finding"><col class="col-action"><col class="col-guidance"><col class="col-priority"><col class="col-photo"></colgroup><thead><tr><th>Ref</th><th>Finding</th><th>Recommended Action</th><th>Guidance</th><th>Priority</th><th>Photo(s)</th></tr></thead><tbody>${actionRowsHtml}</tbody></table><div class="limitations"><div class="lim-title">Priority Key</div><div class="lim-text"><strong style="color:#991B1B">P1 \u2014 Immediate:</strong> Significant risk to life. Action within 24\u201348 hours.<br><strong style="color:#92400E">P2 \u2014 Within 1 Month:</strong> Matters materially affecting fire safety.<br><strong style="color:#1E40AF">P3 \u2014 Within 3 Months:</strong> Matters to address within the next quarter.<br><strong style="color:#374151">P4 \u2014 Within 12 Months:</strong> Longer-term improvements.</div></div></div><div class="rf"><span class="rf-text">OFFICIAL FIRE RISK ASSESSMENT REPORT \u2014 ${esc(A.meta?.id||"")} \u2014 ${esc(A.meta?.date||"")}</span><span class="rf-pgnum">Page 4</span></div></div>`;

  const photoIndexHtml=allPhotos.length>0?`<div class="photo-index-grid">${allPhotos.map((ph,i)=>`<div class="pi-item"><div class="pi-placeholder">\uD83D\uDCF7</div><div class="pi-meta"><div class="pi-num">Photo ${i+1} of ${allPhotos.length} &nbsp;\u00B7&nbsp; ${esc(ph.id)}</div><div class="pi-caption">${esc(ph.caption||"No caption")}</div><div class="pi-ref-tag">Ref: ${esc(ph.ref)} &nbsp;\u00B7&nbsp; ${esc(ph.section)}</div></div></div>`).join("")}</div>`:`<div style="font-family:'Nunito',sans-serif;font-size:9pt;color:#9CA3AF;text-align:center;padding:10mm 0;border:1px dashed #E5E7EB;border-radius:6px;">No photographs were attached to this assessment.</div>`;
  const photoPage=`<div class="page"><div class="page-accent"></div><div class="rh"><div class="rh-logo">Fire<em>site</em></div><div class="rh-addr">${nl2br(p.address||"\u2014")}<br>${esc(A.meta?.id||"")}</div></div><div class="page-body"><div class="sh" style="margin-top:0"><div class="sh-num" style="background:#374151">\uD83D\uDCF7</div><div class="sh-text">Photographic Evidence Index</div><div class="sh-rule"></div></div><p style="font-family:'Nunito',sans-serif;font-size:7.5pt;color:#6B7280;margin-bottom:4mm;">${allPhotos.length} photograph${allPhotos.length===1?"":"s"} recorded during this assessment.</p>${photoIndexHtml}</div><div class="rf"><span class="rf-text">OFFICIAL FIRE RISK ASSESSMENT REPORT \u2014 ${esc(A.meta?.id||"")} \u2014 ${esc(A.meta?.date||"")}</span><span class="rf-pgnum">Page 5</span></div></div>`;

  const signaturePage=`<div class="page"><div class="page-accent"></div><div class="rh"><div class="rh-logo">Fire<em>site</em></div><div class="rh-addr">${nl2br(p.address||"\u2014")}<br>${esc(A.meta?.id||"")}</div></div><div class="page-body"><div class="sh" style="margin-top:0"><div class="sh-num">C</div><div class="sh-text">Overall Risk Rating</div><div class="sh-rule"></div></div><div class="risk-box"><div class="risk-badge-big ${riskClass(A.overallRisk)}">${riskLabel(A.overallRisk)}</div><div class="risk-desc"><strong>Risk Determination \u2014 ${riskLabel(A.overallRisk)}</strong>${esc(A.riskJustification||"\u2014")}</div></div><div class="sh"><div class="sh-num">D</div><div class="sh-text">Assessor's Declaration &amp; Signature</div><div class="sh-rule"></div></div><div class="declaration"><p>This fire risk assessment has been carried out in accordance with the Regulatory Reform (Fire Safety) Order 2005 (as amended by the Fire Safety Act 2021) and PAS 79-1:2020. The assessment is based on conditions observed at the time of inspection and represents a snapshot in time.</p><p style="margin-top:2mm;">The assessor accepts no liability for the accuracy of information provided by third parties. This report should be read in full and the Action Plan implemented within the stated timescales.</p></div><div class="sig-grid"><div class="sig-box"><div class="sig-lbl">Assessor Name</div><div class="sig-val">${esc(A.meta?.assessorName||"")}</div><div class="sig-sub">Print name</div></div><div class="sig-box"><div class="sig-lbl">Qualifications</div><div class="sig-val">${esc(A.meta?.assessorQuals||"")}</div><div class="sig-sub">Membership / certification</div></div><div class="sig-box"><div class="sig-lbl">Signature</div><div class="sig-val"></div><div class="sig-sub">Sign here</div></div><div class="sig-box"><div class="sig-lbl">Date of Assessment</div><div class="sig-val">${esc(A.meta?.date||"")}</div><div class="sig-sub">DD Month YYYY</div></div><div class="sig-box"><div class="sig-lbl">Responsible Person</div><div class="sig-val">${esc(p.responsiblePerson||"")}</div><div class="sig-sub">Print name \u2014 acknowledges receipt</div></div><div class="sig-box"><div class="sig-lbl">RP Signature &amp; Date</div><div class="sig-val"></div><div class="sig-sub">Sign and date to acknowledge</div></div></div><div class="sh"><div class="sh-num">E</div><div class="sh-text">Standards &amp; Guidance Referenced</div><div class="sh-rule"></div></div><div class="standards-grid"><div class="std"><div class="std-dot"></div><span><span class="std-code">RRO 2005</span> Regulatory Reform (Fire Safety) Order 2005 (as amended)</span></div><div class="std"><div class="std-dot"></div><span><span class="std-code">PAS 79-1:2020</span> Fire risk assessments \u2014 premises other than housing</span></div><div class="std"><div class="std-dot"></div><span><span class="std-code">ADB 2019</span> Approved Document B \u2014 Fire Safety</span></div><div class="std"><div class="std-dot"></div><span><span class="std-code">BS 9999:2017</span> Fire safety in the design, management and use of buildings</span></div><div class="std"><div class="std-dot"></div><span><span class="std-code">BS 5839-1:2017</span> Fire detection and alarm systems</span></div><div class="std"><div class="std-dot"></div><span><span class="std-code">BS 5266-1:2016</span> Emergency lighting</span></div><div class="std"><div class="std-dot"></div><span><span class="std-code">BS EN 1154:1997</span> Controlled door closing devices</span></div><div class="std"><div class="std-dot"></div><span><span class="std-code">BS 7671:2018+A2</span> IET Wiring Regulations 18th Edition</span></div><div class="std"><div class="std-dot"></div><span><span class="std-code">Building Safety Act 2022</span> Higher-risk buildings regime</span></div><div class="std"><div class="std-dot"></div><span><span class="std-code">DCLG Guide</span> ${esc(A.meta?.dclgGuide||"Applicable premises type")}</span></div></div><div class="limitations" style="margin-top:4mm;"><div class="lim-title">Limitations of this Assessment</div><div class="lim-text">This assessment covers the areas of the premises inspected on the date shown. It does not constitute a structural survey or specialist fire engineering report. Recommendations do not override any requirements imposed by the enforcing authority or other legislation.</div></div></div><div class="rf"><span class="rf-text">OFFICIAL FIRE RISK ASSESSMENT REPORT \u2014 ${esc(A.meta?.id||"")} \u2014 ${esc(A.meta?.date||"")}</span><span class="rf-pgnum">Page 6</span></div></div>`;

  document.getElementById("report-root").innerHTML=coverPage+premisesPage+findingsPage+actionPage+photoPage+signaturePage;
}

renderReport(SAMPLE_DATA);
function toggleSample(){renderReport(SAMPLE_DATA);}

// Production hook — call from app.html:
// localStorage.setItem('fs_report_data', JSON.stringify(assessment));
// window.open('report.html');
// On load: const d=JSON.parse(localStorage.getItem('fs_report_data')||'null'); if(d) renderReport(d);
window.renderFiresiteReport = function(a){renderReport(a);};
</script>
