                <div className="sig-card">
                  <div className="sig-head">Responsible Person Acknowledgement</div>
                  <div className="sig-body">
                    <div className="sig-f"><div className="sig-l">Name</div><div className="sig-v">{a.rpName||"—"}</div></div>
                    <div className="sig-f"><div className="sig-l">Title</div><div className="sig-v">{a.rpTitle||"—"}</div></div>
                    <div className="sig-f"><div className="sig-l">Signature</div><div className="sig-c">Awaiting signature</div></div>
                    <div className="sig-f"><div className="sig-l">Date</div><div className="sig-v" style={{color:"#6E7681",borderColor:"#8B949E"}}>—</div></div>
                  </div>
                </div>
              </div>
              <RFtr pg={6}/>
            </div>

            {/* PAGE 7 — PHOTO EVIDENCE APPENDIX */}
            <div style={{textAlign:"center",fontSize:8,color:"#94A3B8",marginBottom:5,textTransform:"uppercase",letterSpacing:1,fontWeight:600}}>Page 7 of 7 — Photo Evidence Appendix</div>
            <div className="rpt-page">
              <RHdr/>
              <div className="rpt-body">
                <RSecHead n="H" label="Appendix" title="Photo Evidence"/>
                {allPhotos.length>0 ? (
                  <>
                    <p className="rpt-p">{allPhotos.length} photograph{allPhotos.length!==1?"s were":"was"} recorded during this assessment. Each image is referenced to the relevant question number.</p>
                    <div className="app-grid">
                      {allPhotos.map((p,i)=>(
                        <div key={i} className="app-item">
                          <img src={p.src} alt={p.caption||`Photo ${i+1}`}/>
                          <div className="app-ref">{p.ref} · Photo {i+1}</div>
                          <div className="app-cap">{p.caption||p.questionText?.slice(0,50)||`Reference ${p.ref}`}</div>
                        </div>
                      ))}
                    </div>
                  </>
                ) : (
                  <div style={{textAlign:"center",padding:"30px 20px",color:"#6E7681"}}>
                    <div style={{fontSize:28,marginBottom:8,opacity:0}}></div>
                    <div style={{fontFamily:"'Nunito',sans-serif",fontSize:15,color:"#6B7280",marginBottom:5}}>No photos recorded</div>
                    <div style={{fontSize:11}}>Add photos to questions during the assessment to populate this appendix. Photos appear both here and inline within the relevant finding in Section D.</div>
                  </div>
                )}
              </div>
              <RFtr pg={7}/>
            </div>

          </div>{/* /rpt-wrap */}

          <div style={{padding:"16px",display:"flex",flexDirection:"column",gap:8}}>
            <button className="btn btn-dark btn-full" style={{background:pr,padding:13,fontSize:13,fontWeight:700,borderRadius:9}}
              onClick={()=>generatePDF(a, org)}>
              ⬇ Download PDF Report
            </button>
            <button className="btn btn-ghost btn-full" style={{padding:13,fontSize:13,fontWeight:600,borderRadius:9,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}
              onClick={()=>shareReport(a,org)}>
              ↑ Share Report
            </button>
          </div>

        </div>
      )}{/* /report tab */}
    </div>
  );
}

// ─── ROOT ─────────────────────────────────────────────────────────

// ─── ROOT ─────────────────────────────────────────────────────────
function App(){
  const[state,dispatch]=useReducer(reducer,INIT);
  const[user,setUser]=React.useState(FS_AUTH._u);
  const[showPricing,setShowPricing]=React.useState(false);
  const[showOrgSettings,setShowOrgSettings]=React.useState(false);
  useEffect(()=>{const a=()=>dispatch({type:"SET_ONLINE",v:true}),b=()=>dispatch({type:"SET_ONLINE",v:false});window.addEventListener("online",a);window.addEventListener("offline",b);return()=>{window.removeEventListener("online",a);window.removeEventListener("offline",b);};},[]);
  useEffect(()=>FS_AUTH.onStateChange(u=>setUser(u)),[]);
  useEffect(()=>{try{const s=localStorage.getItem("firesite_v5f");if(s)dispatch({type:"HYDRATE",state:{...INIT,...JSON.parse(s)}});}catch(e){};},[]);
  useEffect(()=>{try{localStorage.setItem("firesite_v5f",JSON.stringify(state));}catch(e){};},[state]);
  if(!user)return <AuthScreen onAuth={u=>setUser(u)}/>;
  const{screen}=state;
  const signOut=()=>FS_AUTH.logout();
  const openSettings=()=>setShowOrgSettings(true);
  return(
    <>
      <style dangerouslySetInnerHTML={{__html:CSS}}/>
      {showPricing&&<PricingModal user={user} onClose={()=>setShowPricing(false)}/>}
      {showOrgSettings&&<OrgSettingsModal state={state} dispatch={dispatch} user={user} onClose={()=>setShowOrgSettings(false)}/>}
      {screen==="landing"&&<Landing dispatch={dispatch} user={user} onSignOut={signOut} onUpgrade={()=>setShowPricing(true)} onSettings={openSettings}/>}
      {screen==="setup"&&<Setup state={state} dispatch={dispatch}/>}
      {screen==="dashboard"&&<Dashboard state={state} dispatch={dispatch} user={user} onSignOut={signOut} onUpgrade={()=>setShowPricing(true)} onSettings={openSettings}/>}
      {screen==="client-setup"&&<ClientSetup state={state} dispatch={dispatch}/>}
      {screen==="assessment"&&<Assessment state={state} dispatch={dispatch}/>}
      {screen==="complete"&&<CompleteScreen state={state} dispatch={dispatch} ALL_SECTIONS={ALL_PDF_SECTIONS_BASE}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
