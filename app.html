const _ac = typeof AudioContext !== 'undefined' ? new AudioContext() : null;
function playSound(type) {
  if (!_ac) return;
  try {
    if (_ac.state === 'suspended') _ac.resume();
    const g = _ac.createGain();
    g.connect(_ac.destination);
    if (type === 'whoosh') {
      // Whoosh: filtered noise sweep
      const buf = _ac.createBuffer(1, _ac.sampleRate * 0.35, _ac.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
      const src2 = _ac.createBufferSource();
      src2.buffer = buf;
      const f = _ac.createBiquadFilter();
      f.type = 'bandpass';
      f.frequency.setValueAtTime(800, _ac.currentTime);
      f.frequency.linearRampToValueAtTime(3000, _ac.currentTime + 0.25);
      f.Q.value = 1.5;
      src2.connect(f);
      f.connect(g);
      g.gain.setValueAtTime(0.18, _ac.currentTime);
      g.gain.linearRampToValueAtTime(0, _ac.currentTime + 0.35);
      src2.start();
      src2.stop(_ac.currentTime + 0.35);
    } else if (type === 'click') {
      // Soft click
      const o = _ac.createOscillator();
      o.type = 'sine';
      o.frequency.setValueAtTime(600, _ac.currentTime);
      o.frequency.linearRampToValueAtTime(300, _ac.currentTime + 0.06);
      o.connect(g);
      g.gain.setValueAtTime(0.12, _ac.currentTime);
      g.gain.linearRampToValueAtTime(0, _ac.currentTime + 0.07);
      o.start();
      o.stop(_ac.currentTime + 0.07);
    } else if (type === 'success') {
      // Success chime
      [523, 659, 784].forEach((hz, i) => {
        const o = _ac.createOscillator();
        o.type = 'sine';
        o.frequency.value = hz;
        const gn = _ac.createGain();
        gn.gain.setValueAtTime(0, _ac.currentTime + i * 0.1);
        gn.gain.linearRampToValueAtTime(0.1, _ac.currentTime + i * 0.1 + 0.05);
        gn.gain.linearRampToValueAtTime(0, _ac.currentTime + i * 0.1 + 0.2);
        o.connect(gn);
        gn.connect(_ac.destination);
        o.start(_ac.currentTime + i * 0.1);
        o.stop(_ac.currentTime + i * 0.1 + 0.25);
      });
    }
  } catch(e) {}
}

// Advanced mode trigger check — returns array of trigger reasons
const checkAdvancedTriggers = (answers) => {
  const triggers = [];
  if (answers["P1.3a"]?.ans==="y") triggers.push("Building exceeds 18m — Building Safety Act 2022 higher-risk regime applies");
  if (answers["P1.5"]?.ans==="y") triggers.push("Sleeping accommodation present — significantly elevated life safety risk");
  const occ4 = answers["P1.4"]?.ans||"";
  if (occ4.startsWith("251")||occ4.startsWith("500")) triggers.push("Large occupancy (251+ persons) — complex evacuation strategy required");
  const occAns = (answers["P1.2"]?.occupancyCat||answers["P1.2"]?.ans||"").toLowerCase();
  if (["care","hospital","hotel","hmo","school","sheltered","hostel","sleeping"].some(t=>occAns.includes(t))) triggers.push("High-risk occupancy type detected — enhanced assessment strongly recommended");
  if (answers["1.2"]?.ans==="y") triggers.push("Potential explosive/flammable atmosphere — DSEAR and ATEX zone classification required");
  if (answers["4.1"]?.ans==="y"&&answers["4.2"]?.ans==="n") triggers.push("Credible arson risk with inadequate controls identified");
  const basementAns = (answers["P1.3b"]?.ans||"").trim();
  if (basementAns.length>4&&basementAns.toLowerCase()!=="no"&&basementAns.toLowerCase()!=="n/a") triggers.push("Basement or sub-ground levels present — complex escape and compartmentation strategy required");
  return triggers;
};

function reducer(state, action) {
  switch(action.type) {
    case "HYDRATE":       return {...action.state};
    case "SET_ORG":       return {...state, org:{...state.org,...action.p}};
    case "SETUP_STEP":    return {...state, setupStep:action.i};
    case "SET_USER_TYPE": return {...state, org:{...state.org, userType:action.v, showDisclaimer:action.v!=="assessor"}};
    case "FINISH_SETUP":  return {...state, screen:"dashboard", setupDone:true, setupStep:0};
    case "EDIT_ORG":      return {...state, screen:"setup", setupStep:0};
    case "SET_ONLINE":    return {...state, isOnline:action.v};

    case "NEW_ASSESSMENT": {
      const id = Date.now();
      const a  = makeAssessment(state.assessments.length+1);
      a.id = id;
      return {...state, assessments:[...state.assessments,a], activeId:id, screen:"client-setup"};
    }
    case "SET_ACTIVE":    return {...state, activeId:action.id, screen:action.screen||"assessment"};
    case "UPDATE_ASSESSMENT": return {
      ...state,
      assessments:state.assessments.map(a=>a.id===state.activeId?{...a,...action.patch}:a)
    };
    case "ANS": return {
      ...state,
      assessments:state.assessments.map(a=>a.id===state.activeId
        ?{...a,answers:{...a.answers,[action.ref]:{...(a.answers[action.ref]||{}),...action.patch}},savedAt:action.ts}
        :a)
    };
    case "SEC": return {
      ...state,
      assessments:state.assessments.map(a=>a.id===state.activeId?{...a,secIdx:action.i,qIdx:0,mode:"card"}:a),
      showMissed:false, justDone:null,
    };
    case "Q_IDX": return {
      ...state,
      assessments:state.assessments.map(a=>a.id===state.activeId?{...a,qIdx:action.i}:a),
    };
    case "SET_MODE": return {
      ...state,
      assessments:state.assessments.map(a=>a.id===state.activeId?{...a,mode:action.mode}:a),
    };
    case "DONE":          return {...state, justDone:action.i};
    case "CLR_DONE":      return {...state, justDone:null};
    case "SHOW_MISSED":   return {...state, showMissed:true};
    case "HIDE_MISSED":   return {...state, showMissed:false};
    case "SHOW_VALIDATION":return {...state, showValidation:true};
    case "COMPLETE":      return {
      ...state, screen:"complete",
      assessments:state.assessments.map(a=>a.id===state.activeId
        ?{...a,status:"complete",completedAt:action.ts,riskRating:action.riskRating,nextReview:action.nextReview}
        :a)
    };
    case "UPDATE_ACTION": return {
      ...state,
      assessments:state.assessments.map(a=>a.id===state.activeId
        ?{...a,answers:{...a.answers,[action.ref]:{...a.answers[action.ref],actionStatus:action.status}}}
        :a)
    };
    case "REMEMBER_PERSON": {
      const persons = state.org.recentPersons||[];
      const updated = [action.name,...persons.filter(p=>p!==action.name)].slice(0,6);
      return {...state, org:{...state.org, recentPersons:updated}};
    }
    case "SET_ADVANCED": return {
      ...state,
      assessments:state.assessments.map(a=>a.id===state.activeId?{...a,advancedMode:action.v,advancedDismissed:action.v?false:a.advancedDismissed}:a)
    };
    case "DISMISS_ADVANCED": return {
      ...state,
      assessments:state.assessments.map(a=>a.id===state.activeId?{...a,advancedDismissed:true}:a)
    };
    case "SKIP_QUESTION": return {
      ...state,
      assessments:state.assessments.map(a=>a.id===state.activeId
        ?{...a,answers:{...a.answers,[action.ref]:{...(a.answers[action.ref]||{}),skipped:action.v,ans:action.v?"n/a":null}},savedAt:action.ts}
        :a)
    };
    case "GO": return {...state, screen:action.screen, showMissed:false, showValidation:false};
    default:   return state;
  }
}

// ─── HELPERS ──────────────────────────────────────────────────────
const isAnswered = (q, ans={}) => {
  if (ans.skipped) return true;
  if (q.t==="multi")     return (ans.sel||[]).length>0;
  if (q.t==="text")      return !!(ans.ans||"").trim();
  if (q.t==="address")   return !!(ans.ans||"").trim();
  if (q.t==="occupancy") return !!(ans.occupancyCat||ans.ans||"").trim();
  if (q.t==="floorarea") return !!(ans.floorArea||ans.floors);
  if (q.t==="occupantcount") return !!(ans.ans);
  if (q.t==="textarea")  return !!(ans.ans||"").trim();
  if (q.t==="extinguisher") return (ans.extinguishers||[]).length>0;
  if (q.t==="contractor") return !!(ans.contractorName||ans.ans||"").trim();
  return !!ans.ans;
};
const isMissed  = (q, ans) => q.required && !isAnswered(q, ans||{});
const fmtDate   = iso => iso?new Date(iso).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}):"—";
const riskCol   = r => r?.startsWith("Critical")?"#B91C1C":r?.startsWith("High")?"#D97706":r?.startsWith("Medium")?"#C0392B":"#059669";
const riskBg    = r => r?.startsWith("Critical")?"#FEF2F2":r?.startsWith("High")?"#FFFBEB":r?.startsWith("Medium")?"#FDF3EE":"#0D3321";
const pColor    = p => p?.includes("P1")?"#B91C1C":p?.includes("P2")?"#D97706":p?.includes("P3")?"#C0392B":"#059669";
const pBg       = p => p?.includes("P1")?"#FEF2F2":p?.includes("P2")?"#FFFBEB":p?.includes("P3")?"#FDF3EE":"#0D3321";

// Add target date from shortcut
const addDays = (days) => {
  const d = new Date();
  d.setDate(d.getDate()+days);
  return d.toISOString().split("T")[0];
};

// Should a question be shown given current answers (skip logic)
const shouldShow = (q, answers) => {
  const rule = SKIP_LOGIC[q.ref];
  if (!rule) return true;
  if (rule.hideWhen !== undefined) return answers[rule.parent]?.ans !== rule.hideWhen;
  return answers[rule.parent]?.ans === rule.showWhen;
};

// Get visible questions for a section (optionally include advanced questions)
const visibleQs = (section, answers, advMode=false) => {
  const base = section.questions.filter(q => shouldShow(q, answers));
  if (!advMode) return base;
  const adv = (ADVANCED_QUESTIONS[section.id]||[]).filter(q => shouldShow(q, answers));
  return [...base, ...adv];
};

// Count answered in visible questions only
const countAnswered = (section, answers) =>
  visibleQs(section, answers).filter(q => isAnswered(q, answers[q.ref]||{})).length;

// Estimate minutes remaining
const estMins = (assessments_obj, answers) => {
  const totalUnanswered = FRA_SECTIONS.reduce((n,s) =>
    n + visibleQs(s,answers).filter(q=>!isAnswered(q,answers[q.ref]||{})).length, 0);
  return Math.ceil(totalUnanswered * 0.25); // ~15 seconds per question
};

function LogoDrop({logo, onLogo}) {
  const ref = useRef();
  const handle = f => {
    if (!f?.type.startsWith("image/")) return;
    const r = new FileReader();
    r.onload = e => onLogo(e.target.result);
    r.readAsDataURL(f);
  };
  return (
    <div className="logo-drop" onClick={()=>ref.current.click()}
      onDragOver={e=>e.preventDefault()}
      onDrop={e=>{e.preventDefault();handle(e.dataTransfer.files[0]);}}>
      <input ref={ref} type="file" accept="image/*" style={{display:"none"}} onChange={e=>handle(e.target.files[0])}/>
      {logo ? <><img src={logo} alt="logo"/><span style={{fontSize:9,color:"#6E7681"}}>Tap to change</span></> :
        <><span style={{fontSize:20}}>🖼️</span><span style={{fontSize:11,fontWeight:600,color:"#374151"}}>Drop or tap to upload</span><span style={{fontSize:9,color:"#6E7681"}}>PNG, SVG or JPG</span></>}
    </div>
  );
}

function AddressFinder({value, onChange}) {
  const [query,setQuery]=useState(value||"");
  const [results,setResults]=useState([]);
  const [loading,setLoading]=useState(false);
  const [selected,setSelected]=useState(!!value);
  const [error,setError]=useState("");
  const debounce=useRef(null);
  const search=async(q)=>{
    if(!q||q.length<2){setResults([]);return;}
    setLoading(true);setError("");
    try{
      const isPostcode=/^[A-Z]{1,2}[0-9][0-9A-Z]?\s*[0-9][A-Z]{2}$/i.test(q.trim());
      if(isPostcode){
        const r=await fetch("https://api.postcodes.io/postcodes/"+encodeURIComponent(q.trim()));
        const d=await r.json();
        if(d.status===200&&d.result){
          const pc=d.result;
          setResults([{display:pc.admin_district+(pc.parish&&pc.parish!==pc.admin_district?", "+pc.parish:""),sub:pc.postcode+" - "+(pc.nuts||pc.region||""),full:(pc.admin_district||"")+", "+pc.postcode}]);
        }else{setError("Postcode not found. Enter address manually.");setResults([]);}
      }else{setResults([{display:"Enter postcode for best results",sub:"e.g. EC2V 4QS",full:"",isHint:true}]);}
    }catch(e){setError("Lookup unavailable - type address manually.");setResults([]);}
    setLoading(false);
  };
  const handleInput=v=>{setQuery(v);setSelected(false);onChange(v);if(debounce.current)clearTimeout(debounce.current);debounce.current=setTimeout(()=>search(v),500);};
  const selectResult=r=>{if(r.isHint)return;setQuery(r.full||r.display);onChange(r.full||r.display);setResults([]);setSelected(true);};
  const clear=()=>{setQuery("");onChange("");setSelected(false);setResults([]);};
  if(selected&&value)return(
    <div style={{background:"#FDF3EE",border:"1px solid #C0392B33",borderRadius:10,padding:"11px 14px",marginBottom:8}}>
      <div style={{fontSize:9,fontWeight:700,textTransform:"uppercase",letterSpacing:1,color:"#C0392B",marginBottom:3}}>Address confirmed</div>
      <div style={{fontSize:13,color:"#1C1C1C",lineHeight:1.5,flex:1}}>{value}</div>
      <div style={{marginTop:8}}>
        <textarea style={{width:"100%",background:"#21262D",border:"1px solid #30363D",borderRadius:7,padding:"8px 10px",fontSize:12,color:"#374151",outline:"none",resize:"none",minHeight:64,lineHeight:1.5,fontFamily:"'Nunito',sans-serif"}}
          placeholder="Add building name, street number and full address..." value={value} onChange={e=>onChange(e.target.value)}/>
      </div>
      <span style={{fontSize:10,fontWeight:600,color:"#C0392B",cursor:"pointer",marginTop:6,display:"inline-block"}} onClick={clear}>Change</span>
    </div>
  );
  return(
    <div>
      <div style={{position:"relative",marginBottom:8}}>
        <input style={{width:"100%",background:"#1C2128",border:"2px solid #30363D",borderRadius:10,padding:"12px 44px 12px 14px",fontSize:14,color:"#374151",outline:"none",fontFamily:"'Nunito',sans-serif"}}
          placeholder="Enter postcode (e.g. EC2V 4QS) or address..."
          value={query} onChange={e=>handleInput(e.target.value)}/>
        <button style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",background:"#C0392B",border:"none",borderRadius:6,width:28,height:28,color:"#fff",cursor:"pointer",fontSize:13}} onClick={()=>search(query)}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
      </div>
      {loading&&<div style={{fontSize:11,color:"#6E7681",padding:"6px 12px"}}>Looking up address...</div>}
      {error&&<div style={{fontSize:11,color:"#6E7681",padding:"6px 12px"}}>{error}</div>}
      {results.length>0&&(
        <div style={{background:"#161B22",border:"1.5px solid #30363D",borderRadius:10,overflow:"hidden",marginBottom:8,boxShadow:"0 4px 16px rgba(0,0,0,.08)"}}>
          {results.map((r,i)=>(
            <div key={i} style={{padding:"11px 14px",fontSize:12,color:"#374151",cursor:"pointer",borderBottom:"1px solid #21262D"}} onClick={()=>selectResult(r)}>
              <div style={{fontWeight:600,color:"#1C1C1C"}}>{r.display}</div>
              {r.sub&&<div style={{color:"#6E7681",fontSize:11}}>{r.sub}</div>}
            </div>
          ))}
        </div>
      )}
      <textarea style={{width:"100%",background:"#1C2128",border:"2px solid #30363D",borderRadius:10,padding:"11px 14px",fontSize:13,color:"#374151",outline:"none",resize:"none",minHeight:80,lineHeight:1.6,fontFamily:"'Nunito',sans-serif",marginBottom:8}}
        placeholder="Or type the full address here..." value={value||""} onChange={e=>{onChange(e.target.value);setQuery(e.target.value);}}/>
    </div>
  );
}

function PostcodeLookup({state={},onChange}) {
  const [pc,setPc]=React.useState("");
  const [results,setResults]=React.useState([]);
  const [loading,setLoading]=React.useState(false);
  const [err,setErr]=React.useState("");
  const lookup=()=>{
    const clean=pc.replace(/\s/g,"").toUpperCase();
    if(clean.length<3){setErr("Enter a valid UK postcode");return;}
    setLoading(true);setErr("");setResults([]);
    fetch("https://api.postcodes.io/postcodes/"+encodeURIComponent(clean)).then(r=>r.json()).then(d=>{setLoading(false);if(d.status===200&&d.result){setResults([d.result]);}else{setErr("Not found - enter manually below");}}).catch(()=>{setLoading(false);setErr("Lookup unavailable - enter manually");});
  };
  const sel=(r)=>{const addr=(r.postcode||"")+(r.admin_district?", "+r.admin_district:"");onChange({...state,ans:addr,postcode:r.postcode});setResults([]);setPc(r.postcode||"");};

                          {isFl&&<span style={{fontSize:9,fontWeight:700,background:"rgba(192,57,43,.2)",color:"#E8773A",padding:"1px 5px",borderRadius:3}}>FLAGGED</span>}
                          {!isAns&&q.required&&<span style={{fontSize:9,fontWeight:700,background:"rgba(245,158,11,.15)",color:"#FCD34D",padding:"1px 5px",borderRadius:3}}>REQUIRED</span>}
                        </div>
                        <div style={{fontSize:12,color:"#F0F6FC",marginBottom:3,lineHeight:1.4}}>{q.q}</div>
                        {editRef===q.ref ? (
                          <div style={{display:"flex",gap:6,marginTop:6}}>
                            <input style={{flex:1,padding:"6px 10px",background:"#1C2128",border:"1px solid #30363D",borderRadius:6,color:"#F0F6FC",fontSize:12}} value={editVal} onChange={e=>setEditVal(e.target.value)} autoFocus/>
                            <button onClick={()=>saveEdit(q.ref,editVal)} style={{padding:"6px 10px",background:"#E8773A",border:"none",borderRadius:6,color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer"}}>Save</button>
                            <button onClick={()=>setEditRef(null)} style={{padding:"6px 10px",background:"#30363D",border:"none",borderRadius:6,color:"#8B949E",fontSize:12,cursor:"pointer"}}>&#10005;</button>
                          </div>
                        ) : (
                          <div style={{fontSize:12,color:isAns?"#8B949E":"#6E7681",fontStyle:isAns?"normal":"italic"}}>{displayAns}</div>
                        )}
                      </div>
                      {editRef!==q.ref && (q.t==="text"||q.t==="textarea"||q.t==="yn"||q.t==="ynna"||q.t==="ynnutd"||q.t==="ynnv") && (
                        <button onClick={()=>{setEditRef(q.ref);setEditVal(ansVal||"");}} style={{padding:"4px 10px",borderRadius:6,border:"1px solid #30363D",background:"#1C2128",color:"#8B949E",fontSize:11,fontWeight:600,cursor:"pointer",flexShrink:0,marginTop:2}}>Edit</button>
                      )}
                    </div>
                  );
                })}
              </div>
            );
          })}
          <div style={{padding:16,textAlign:"center"}}>
            <button onClick={()=>setOpen(false)} style={{padding:"10px 24px",borderRadius:8,background:"#E8773A",border:"none",color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer"}}>&#10003; Done reviewing</button>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── SUB-QUESTIONS COMPONENT ─────────────────────────────────────────────
function SubQuestions({q, state, upd}) {
  var ans = state.ans || null;
  // Warning box — shown when a specific answer triggers a risk alert
  if (q.warn && ans === q.warn.on) {
    return (
      <div style={{marginTop:14,padding:14,background:"rgba(220,38,38,.06)",borderRadius:10,border:"1px solid rgba(220,38,38,.3)"}}>
        <div style={{display:"flex",gap:8,alignItems:"flex-start"}}>
          <span style={{fontSize:18,lineHeight:1}}>⚠️</span>
          <div style={{flex:1}}> 
            <div style={{fontSize:12,fontWeight:700,color:"#DC2626",marginBottom:4}}>{q.warn.title||"Important"}</div>
            <div style={{fontSize:12,color:"#F0F6FC",lineHeight:1.6}}>{q.warn.msg}</div>
            {q.warn.ack && (
              <button onClick={()=>{var p={};p[q.ref+"_ack"]=!state[q.ref+"_ack"];upd(p);}}
                style={{marginTop:10,padding:"7px 14px",borderRadius:7,cursor:"pointer",fontSize:11,fontWeight:700,
                  border:state[q.ref+"_ack"]?"2px solid #059669":"2px solid #DC2626",
                  background:state[q.ref+"_ack"]?"rgba(5,150,105,.12)":"rgba(220,38,38,.08)",
                  color:state[q.ref+"_ack"]?"#059669":"#DC2626",display:"flex",alignItems:"center",gap:6}}>
                {state[q.ref+"_ack"]?<><span>✓</span><span> Acknowledged</span></>:<><span>□</span><span> I acknowledge this risk</span></>}
              </button>
            )}
          </div>
        </div>
      </div>
    );
  }
  // subNo — shown when ans === "n"
  var activeSub = null;
  if (q.sub && (ans === q.sub.on || (Array.isArray(state.sel) && state.sel.includes(q.sub.on)))) activeSub = q.sub;
  else if (q.subNo && ans === "n") activeSub = q.subNo;
  if (!activeSub) return null;
  var isWarn = !!(q.subNo && ans === "n" && activeSub === q.subNo && activeSub.warnTitle);
  return (
    <div style={{marginTop:14,padding:14,background:isWarn?"rgba(220,38,38,.05)":"rgba(232,119,58,.06)",borderRadius:10,border:isWarn?"1px solid rgba(220,38,38,.25)":"1px solid rgba(232,119,58,.2)"}}>
      {isWarn&&<div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:.8,color:"#DC2626",marginBottom:8}}>{activeSub.warnTitle}</div>}
      {!isWarn&&<div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:.8,color:"#E8773A",marginBottom:10}}>Follow-up questions</div>}
      {(activeSub.fields||[]).map(function(sf) { return (
        <div key={sf.ref} style={{marginBottom:12}}>
          <div style={{fontSize:12,fontWeight:600,color:"#F0F6FC",marginBottom:6}}>{sf.q}</div>
          {sf.t==="text" && (
            <input className="qc-inp" placeholder={sf.ph||"Enter details..."}
              value={state[sf.ref+"_ans"]||""}
              onChange={function(e){var p={};p[sf.ref+"_ans"]=e.target.value;upd(p);}}/>
          )}
          {sf.t==="textarea" && (
            <textarea className="obs-box" style={{minHeight:60}} placeholder={sf.ph||"Enter details..."}
              value={state[sf.ref+"_ans"]||""}
              onChange={function(e){var p={};p[sf.ref+"_ans"]=e.target.value;upd(p);}}/>
          )}
          {sf.t==="yn" && (
            <div style={{display:"flex",gap:8}}>
              {[{v:"y",l:"Yes"},{v:"n",l:"No"}].map(function(o){ return (
                <button key={o.v}
                  onClick={function(){var p={};p[sf.ref+"_ans"]=state[sf.ref+"_ans"]===o.v?null:o.v;upd(p);}}
                  style={{flex:1,padding:9,borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:600,
                    border:state[sf.ref+"_ans"]===o.v?"2px solid #E8773A":"2px solid #30363D",
                    background:state[sf.ref+"_ans"]===o.v?"rgba(232,119,58,.15)":"#1C2128",
                    color:state[sf.ref+"_ans"]===o.v?"#E8773A":"#8B949E"}}>
                  {o.l}
                </button>
              );})}
            </div>
          )}
          {sf.t==="multi" && (
            <div className="mc-wrap">
              {(sf.opts||[]).map(function(o){ return (
                <span key={o}
                  className={"mc-c "+((state[sf.ref+"_sel"]||[]).includes(o)?"on":"")}
                  onClick={function(){
                    var c=state[sf.ref+"_sel"]||[];
                    var p={};
                    p[sf.ref+"_sel"]=c.includes(o)?c.filter(function(x){return x!==o;}):[...c,o];
                    upd(p);
                  }}>
                  {o}
                </span>
              );})}
            </div>
          )}
        </div>
      );})}
    </div>
  );
}

// ─── WIDTH CHECK COMPONENT ────────────────────────────────────────────────
function WidthTool({q, state, upd}) {
  if (!q.widthCheck) return null;
  var widths = state[q.ref+"_widths"] || [{id:1,loc:"",mm:""}];
  function wColor(mm) {
    if (!mm) return "#8B949E";
    var n = Number(mm);
    if (n >= 1050) return "#22c55e";
    if (n >= 750) return "#f59e0b";
    return "#ef4444";
  }
  function wLabel(mm) {
    if (!mm) return "--";
    var n = Number(mm);
    if (n >= 1050) return "OK";
    if (n >= 850) return "Check";
    if (n >= 750) return "Max 60p";
    return "NARROW";
  }
  return (
    <div style={{marginTop:14,padding:14,background:"rgba(255,255,255,.03)",borderRadius:10,border:"1px solid #30363D"}}>
      <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:.8,color:"#8B949E",marginBottom:6}}>Measure widths</div>
      <div style={{fontSize:11,color:"#8B949E",marginBottom:10}}>Enter clear width in mm. ADB: 750mm (up to 60p), 850mm (up to 110p), 1050mm (up to 220p).</div>
      {widths.map(function(w,wi){ return (
        <div key={w.id} style={{display:"flex",gap:8,marginBottom:8,alignItems:"center"}}>
          <input style={{flex:2,background:"#21262D",border:"1px solid #30363D",borderRadius:8,padding:"9px 10px",fontSize:12,color:"#F0F6FC",outline:"none"}}
            placeholder="Location (e.g. Main entrance)"
            value={w.loc}
            onChange={function(e){var ws=[...widths];ws[wi]={...ws[wi],loc:e.target.value};var p={};p[q.ref+"_widths"]=ws;upd(p);}}/>
          <input type="number"
            style={{flex:1,background:"#21262D",border:"1px solid #30363D",borderRadius:8,padding:"9px 10px",fontSize:13,fontWeight:700,color:"#F0F6FC",outline:"none",textAlign:"center"}}
            placeholder="mm"
            value={w.mm}
            onChange={function(e){var ws=[...widths];ws[wi]={...ws[wi],mm:e.target.value};var p={};p[q.ref+"_widths"]=ws;upd(p);}}/>
          <span style={{fontSize:11,fontWeight:700,minWidth:54,textAlign:"right",color:wColor(w.mm)}}>{wLabel(w.mm)}</span>
        </div>
      );})}
      <button
        onClick={function(){var ws=[...widths,{id:Date.now(),loc:"",mm:""}];var p={};p[q.ref+"_widths"]=ws;upd(p);}}
        style={{fontSize:11,color:"#E8773A",background:"none",border:"1px dashed #E8773A",borderRadius:7,padding:"5px 12px",cursor:"pointer"}}>
        + Add measurement
      </button>
    </div>
  );
}

  const startRec=()=>{navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{const c=[];const m=new MediaRecorder(stream);m.ondataavailable=e=>c.push(e.data);m.onstop=()=>{const b=new Blob(c,{type:"audio/webm"});const r=new FileReader();r.onload=ev=>onSaveVoice(ev.target.result);r.readAsDataURL(b);stream.getTracks().forEach(t=>t.stop());};m.start();setMr(m);setRec(true);}).catch(()=>alert("Microphone access required"));};
  const stopRec=()=>{if(mr){mr.stop();setRec(false);}};
  const MicIcon=()=><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>;
  const CamIcon=()=><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>;
  const ImgIcon=()=><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>;
  const NoteIcon=()=><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>;
  const FlagIcon=({filled})=><svg width="13" height="13" viewBox="0 0 24 24" fill={filled?"currentColor":"none"} stroke="currentColor" strokeWidth="2"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>;

      {!voiceNote&&!rec&&<button className="ctb-btn" onClick={startRec} title="Add voice note"><MicIcon/>Voice</button>}
      {rec&&<button className="ctb-btn recording" onClick={stopRec} title="Stop recording"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>Stop</button>}
      {voiceNote&&!rec&&<button className="ctb-btn active" onClick={startRec} title="Re-record"><MicIcon/>✓ Voice</button>}
      {showCamera&&<button className={`ctb-btn${photosArr.length>0?" active":""}`} title="Take photo"><input ref={camRef} type="file" accept="image/*" capture={/Mobi|Android/i.test(navigator.userAgent)?"environment":undefined} onChange={e=>handleFiles(e.target.files)}/><CamIcon/>{photosArr.length>0?"Photos ("+photosArr.length+")":"Camera"}</button>}
      {showCamera&&<button className="ctb-btn" title="Choose from library"><input ref={fileRef} type="file" accept="image/*" multiple onChange={e=>handleFiles(e.target.files)}/><ImgIcon/>Library</button>}

function QuestionCard({q, qIdx, totalVisible, state={}, onChange, onNext, onPrev, showMissed, sectionId, recentPersons=[], onRememberPerson}) {
  const {ans=null, note="", flagged=false, sel=[], photos=[],
         action="", priority="P3 — Within 3 months",
         responsible="", targetDate="", actionStatus="pending"} = state;

  const [showNote,  setShowNote]  = useState(!!note);
  const [showGuide, setShowGuide] = useState(false);
  const [flash,     setFlash]     = useState(false);
  const [showFlagAck, setShowFlagAck] = useState(false);
  const [photosArr, setPhotosArr] = useState(photos);

  // Keep local photos in sync
  useEffect(()=>{ setPhotosArr(photos); }, []);

  const upd = patch => onChange({
    ...state, ans, note, flagged, sel,
    photos:photosArr, action, priority,
    responsible, targetDate, actionStatus, ...patch
  });

  const updPhotos = fn => {
    const next = typeof fn==="function" ? fn(photosArr) : fn;
    setPhotosArr(next);
    upd({photos:next});
  };

  const handleFiles = files => {
    // Flash effect for camera capture feedback
    setFlash(true);
    setTimeout(()=>setFlash(false), 150);
    Array.from(files).forEach(f => {
      if (!f?.type.startsWith("image/")) return;
      const r = new FileReader();
      r.onload = e => {
        const words = q.q.split(" ").slice(0,5).join(" ");
        updPhotos(prev=>[...prev,{id:Date.now()+Math.random(),ref:q.ref,src:e.target.result,caption:words+"…"}]);
      };
      r.readAsDataURL(f);
    });
  };

  const toggleSel = o => upd({sel:sel.includes(o)?sel.filter(x=>x!==o):[...sel,o]});

  // Smart No
  const handleAns = v => {
    const newAns = ans===v ? null : v;
    const sa=SMART_ACTIONS[q.ref];
    const sf=sa&&newAns&&((sa.on==="y"&&newAns==="y")||(sa.on==="n"&&newAns==="n")||(newAns===sa.on));
    const wasFlagged = !sf && flagged && sa && action === sa.action;
    if(sf){upd({ans:newAns,flagged:true,action:action||sa.action,priority:sa.priority});setShowFlagAck(true);}
    else if(wasFlagged){upd({ans:newAns,flagged:false,action:"",priority:SMART_ACTIONS[q.ref]?.priority||SECTION_PRIORITY[sectionId]||"P3 — Within 3 months"});}
    else{upd({ans:newAns});}
    // Auto-advance after 350ms — suppress if sub-fields or warn triggered
    const hasSubFields = q.sub && (newAns === q.sub.on || (Array.isArray(state.sel) && state.sel.includes(q.sub.on)));
    const hasWarn = q.warn && newAns === q.warn.on;
    if (newAns && !note && !flagged && !sf && !hasSubFields && !hasWarn) {
      setTimeout(() => onNext(), 350);
    }
  };

  const isAns  = isAnswered(q, state);
  const missed = showMissed && isMissed(q, state);
  const defPri = SMART_ACTIONS[q.ref]?.priority || SECTION_PRIORITY[sectionId] || "P3 — Within 3 months";

  const handleFlag = () => {
    const newFlag = !flagged;
    upd({flagged:newFlag, priority:priority||defPri});
  };

  const saveResponsible = name => {
    if (name && name.trim()) onRememberPerson(name.trim());
  };

  const camRef  = useRef();
  const fileRef = useRef();

  return (
    <>
      {/* Photo flash */}
      {flash && <div className="photo-flash" style={{opacity:.8}}/>}

      <div className="q-card slide-in" key={q.ref}>
        {/* Header: ref + progress dots + counter */}
        <div className="qc-header">
          <span className="qc-ref">{q.ref}</span>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <span className="qc-counter">{qIdx+1}<span>/{totalVisible}</span></span>
            <div className="qc-dots">
              {Array.from({length:Math.min(totalVisible,7)}).map((_,i)=>{
                const cls = i<qIdx?"done":i===qIdx?"now":"todo";
                return <div key={i} className={`qc-dot ${cls}`}/>;
              })}
              {totalVisible>7 && <span style={{fontSize:9,color:"#6E7681",marginLeft:3,fontWeight:600}}>+{totalVisible-7}</span>}
            </div>
          </div>
        </div>

        {/* Question text */}
        <div className="qc-question">
          {q.q}{q.required&&<span className="qc-req"> *</span>}
        </div>

        {/* Guidance */}
        {q.g && (
          <>
            <button className="qc-guide-btn" onClick={()=>setShowGuide(s=>!s)}>
              {showGuide?"▴ Hide":"ⓘ What to check"}
            </button>
            {showGuide && <div className="qc-guide">{q.g}</div>}
          </>
        )}

        {/* ANSWERS */}
        {(q.t==="yn"||q.t==="ynna"||q.t==="ynnutd"||q.t==="ynnv") && (
          <div className="big-ans">
            {[
              {v:"y",label:"Yes",icon:<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>},
              {v:"n",label:"No",icon:<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>},
              ...(q.t==="ynna"?[{v:"na",label:"N/A",icon:<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="5" y1="12" x2="19" y2="12"/></svg>}]:[]),
              ...(q.t==="ynnutd"?[{v:"na",label:"N/A",icon:<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="5" y1="12" x2="19" y2="12"/></svg>},{v:"Unable to Determine",label:"Unable to Determine",icon:<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>}]:[]),
              ...(q.t==="ynnv"?[{v:"na",label:"N/A",icon:<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="5" y1="12" x2="19" y2="12"/></svg>},{v:"Not Verifiable",label:"Not Verifiable",icon:<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>}]:[])
            ].map(opt=>(
              <button key={opt.v} className={`big-btn ${ans===opt.v?opt.v:""}`}
                onClick={()=>{playSound('click');handleAns(opt.v);}}>
                <span className="big-btn-icon" style={{fontSize:22}}>{opt.icon}</span>
                <span className="big-btn-label" style={{fontWeight:ans===opt.v?700:600}}>{opt.label}</span>
                <span style={{marginLeft:"auto",width:22,height:22,borderRadius:"50%",background:ans===opt.v?"currentColor":"transparent",opacity:ans===opt.v?.2:.4,border:ans===opt.v?"none":"1.5px solid #30363D",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
                  {ans===opt.v&&<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round" style={{opacity:5}}><polyline points="20 6 9 17 4 12"/></svg>}
                </span>
              </button>
            ))}
          </div>
        )}

        {/* Auto-flag banner */}
        {SMART_ACTIONS[q.ref]&&!flagged&&ans&&((SMART_ACTIONS[q.ref].on==="y"&&ans==="y")||(SMART_ACTIONS[q.ref].on==="n"&&ans==="n")||(SMART_ACTIONS[q.ref].on===ans))&&(
          <div className="autoflag">
            <span style={{fontSize:16,flexShrink:0}}>🚩</span>
            <div><strong style={{color:"#F59E0B"}}>Finding flagged</strong> — a pre-written action has been added to the action plan below. Review and adjust as needed.</div>
          </div>
        )}

        {q.t==="select" && (
          <div>
            <select className="qc-sel" value={ans||""} onChange={e=>upd({ans:e.target.value||null})}>
              <option value="">Select…</option>

const FS_AUTH={
  _u:null,_cbs:[],
  onStateChange(cb){
    cb(this._u);

    _initFB();
    if(_fbAuth&&window.firebase_auth){
      const{onAuthStateChanged}=window.firebase_auth;
      onAuthStateChanged(_fbAuth,async(fbUser)=>{
        if(fbUser){
          const u={uid:fbUser.uid,email:fbUser.email,name:fbUser.displayName||fbUser.email.split('@')[0],plan:'free'};
          if(_fbDb&&window.firebase_firestore){

          }
          this._u=u;try{localStorage.setItem('fs_u',JSON.stringify(u));}catch(e){}
          this._cbs.forEach(c=>c(u));
        }else{
          this._u=null;this._cbs.forEach(c=>c(null));
        }
      });
    }
    return()=>{};
  },
  async login(email,pw){
    _initFB();
    if(_fbAuth&&window.firebase_auth){
      try{

        if(_fbDb&&window.firebase_firestore){
          try{const{doc,getDoc}=window.firebase_firestore;const snap=await getDoc(doc(_fbDb,'users',fbUser.uid));if(snap.exists())Object.assign(u,snap.data());}catch(e){}
        }
        this._u=u;this._cbs.forEach(c=>c(u));
        try{localStorage.setItem('fs_u',JSON.stringify(u));}catch(e){}
        return u;
      }catch(e){throw new Error(e.code==='auth/invalid-credential'||e.code==='auth/wrong-password'?'Incorrect email or password.':e.code==='auth/user-not-found'?'No account found with that email.':e.code==='auth/too-many-requests'?'Too many attempts — please wait a moment.':e.message);}
    }else{
      const u={uid:'u_'+btoa(email).substring(0,8),email,name:email.split('@')[0],plan:'free'};
      this._u=u;this._cbs.forEach(c=>c(u));
      try{localStorage.setItem('fs_u',JSON.stringify(u));}catch(e){}
      return u;
    }
  },
  async signup(email,pw,name){
    _initFB();
    if(_fbAuth&&window.firebase_auth){
      try{
        const{createUserWithEmailAndPassword}=window.firebase_auth;
        const cred=await createUserWithEmailAndPassword(_fbAuth,email,pw);
        const fbUser=cred.user;
        const u={uid:fbUser.uid,email:fbUser.email,name:name||fbUser.email.split('@')[0],plan:'free'};
        if(_fbDb&&window.firebase_firestore){
          try{const{doc,setDoc}=window.firebase_firestore;await setDoc(doc(_fbDb,'users',fbUser.uid),{email:u.email,name:u.name,plan:'free',createdAt:new Date().toISOString()});}catch(e){}
        }
        this._u=u;this._cbs.forEach(c=>c(u));
        try{localStorage.setItem('fs_u',JSON.stringify(u));}catch(e){}
        return u;
      }catch(e){throw new Error(e.code==='auth/email-already-in-use'?'An account with that email already exists.':e.code==='auth/weak-password'?'Password must be at least 6 characters.':e.message);}
    }else{
      const u={uid:'u_'+Date.now(),email,name:name||email.split('@')[0],plan:'free'};
      this._u=u;this._cbs.forEach(c=>c(u));
      try{localStorage.setItem('fs_u',JSON.stringify(u));}catch(e){}
      return u;
    }
  },
  async logout(){
    _initFB();
    if(_fbAuth&&window.firebase_auth){try{const{signOut}=window.firebase_auth;await signOut(_fbAuth);}catch(e){}}
    this._u=null;this._cbs.forEach(c=>c(null));
    try{localStorage.removeItem('fs_u');}catch(e){}
  },
  restore(){try{const s=localStorage.getItem('fs_u');if(s)this._u=JSON.parse(s);}catch(e){}}
};

/* ─ AUTH SCREEN ─ */
function AuthScreen({onAuth}){
  const[mode,setMode]=React.useState('login');
  const[email,setEmail]=React.useState('');
  const[pw,setPw]=React.useState('');
  const[nm,setNm]=React.useState('');
  const[err,setErr]=React.useState('');
  const[busy,setBusy]=React.useState(false);
  const go=async(e)=>{
    e.preventDefault();setErr('');setBusy(true);
    try{
      const u=mode==='login'?await FS_AUTH.login(email,pw):await FS_AUTH.signup(email,pw,nm);
      onAuth(u);
    }catch(ex){setErr(ex.message);}
    finally{setBusy(false);}
  };
  return(
    <div className="auth-wrap">
      <div className="auth-box">
        <div className="auth-logo">
          <img src="https://raw.githubusercontent.com/BluejaiAA/Firesite/main/firesite_logo.png" alt=""/>
          <span className="auth-logo-text">Fire<span>site</span></span>
        </div>
        <h2 className="auth-title">{mode==='login'?'Sign in to your workspace':'Create your account'}</h2>
        <p className="auth-sub">{mode==='login'?'Professional fire risk assessment platform':'Start your free account today'}</p>
        {err&&<div className="auth-error">{err}</div>}
        <form onSubmit={go}>
          {mode==='signup'&&(
            <div className="auth-field">
              <label className="auth-label">Full Name</label>
              <input className="auth-input" type="text" placeholder="Jane Smith" value={nm} onChange={e=>setNm(e.target.value)} required/>
            </div>
          )}
          <div className="auth-field">
            <label className="auth-label">Email</label>
            <input className="auth-input" type="email" placeholder="you@example.com" value={email} onChange={e=>setEmail(e.target.value)} required autoFocus/>
          </div>
          <div className="auth-field">
            <label className="auth-label">Password</label>
            <input className="auth-input" type="password" placeholder={mode==='signup'?'Min 6 characters':'Your password'} value={pw} onChange={e=>setPw(e.target.value)} required/>
          </div>
          <button className="auth-btn" type="submit" disabled={busy}>{busy?(mode==='login'?'Signing in...':'Creating account...'):(mode==='login'?'Sign In':'Create Account')}</button>
        </form>
        <p className="auth-switch">
          {mode==='login'?<>Don't have an account? <a onClick={()=>{setMode('signup');setErr('');}}>Sign up free</a></>:<>Already have an account? <a onClick={()=>{setMode('login');setErr('');}}>Sign in</a></>}
        </p>
      </div>
    </div>
  );

                    <option value="school">School / Educational</option>
                  </select></div>
                <div className="fg span2"><label className="fl">Assessment type</label>
                  <select className="fs" value={a.reviewType||"new"} onChange={e=>upd({reviewType:e.target.value})}>
                    <option value="new">New assessment</option>
                    <option value="review">Review of previous assessment</option>
                    <option value="material_change">Review following material change</option>
                    <option value="enforcement">Reassessment — enforcement notice</option>
                    <option value="incident">Reassessment following fire/incident</option>

                {(a.reviewType||"new")!=="new" &&
                <div className="fg"><label className="fl">Previous assessment date</label>
                  <input className="fi" type="date" value={a.previousAssessmentDate||""} onChange={e=>upd({previousAssessmentDate:e.target.value})}/></div>}
                {(a.reviewType||"new")!=="new" &&
                <div className="fg"><label className="fl">Previous assessment ref.</label>
                  <input className="fi" placeholder="e.g. FRA-2024-001" value={a.previousAssessmentRef||""} onChange={e=>upd({previousAssessmentRef:e.target.value})}/></div>}
                {(a.reviewType||"new")!=="new" &&
                <div className="fg span2"><label className="fl">Previous assessor</label>
                  <input className="fi" placeholder="Name, Company" value={a.previousAssessor||""} onChange={e=>upd({previousAssessor:e.target.value})}/></div>}          </div>
            </div>
            {(a.reviewType||"new")!=="new" && <div style={{marginTop:14,padding:"14px 0 0",borderTop:"1px solid #374151"}}>
              <div style={{fontFamily:"'Nunito',sans-serif",fontSize:13,fontWeight:700,marginBottom:8,color:"#9CA3AF"}}>Previous Action Plan Status</div>
              <p style={{fontSize:11,color:"#6B7280",marginBottom:8}}>Record the status of actions from the previous assessment (PAS 79-1:2020 Cl.6.5).</p>
              {(a.previousActionsStatus||[]).map((item,i)=>(
                <div key={i} style={{display:"grid",gridTemplateColumns:"1fr 120px 28px",gap:6,marginBottom:6,alignItems:"center"}}>
                  <input className="fi" style={{fontSize:11}} placeholder="Action description" value={item.description||""} onChange={e=>{const arr=[...(a.previousActionsStatus||[])];arr[i]={...arr[i],description:e.target.value};upd({previousActionsStatus:arr});}}/>
                  <select className="fs" style={{fontSize:11}} value={item.status||"outstanding"} onChange={e=>{const arr=[...(a.previousActionsStatus||[])];arr[i]={...arr[i],status:e.target.value};upd({previousActionsStatus:arr});}}>
                    <option value="completed">Completed</option>
                    <option value="outstanding">Outstanding</option>
                    <option value="deferred">Deferred</option>
                    <option value="superseded">Superseded</option>
                  </select>
                  <button onClick={()=>{const arr=(a.previousActionsStatus||[]).filter((_,j)=>j!==i);upd({previousActionsStatus:arr});}} style={{background:"none",border:"none",color:"#EF4444",cursor:"pointer",fontSize:16}}>✕</button>
                </div>
              ))}
              <button className="btn btn-ghost btn-sm" style={{marginTop:4,fontSize:11}} onClick={()=>upd({previousActionsStatus:[...(a.previousActionsStatus||[]),{description:"",status:"outstanding"}]})}>+ Add previous action</button>
            </div>}
<div className="fcf">
              <button className="btn btn-ghost btn-sm" onClick={()=>dispatch({type:"GO",screen:"dashboard"})}>Cancel</button>
              <button className="btn btn-teal" onClick={()=>dispatch({type:"GO",screen:"assessment"})}>Start Assessment →</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── DASHBOARD ────────────────────────────────────────────────────
function Dashboard({state, dispatch, user, onSignOut, onUpgrade, onSettings}) {
  const {org, assessments} = state;
  const ac = org.accentColor||"#C0392B";
  const pr = org.primaryColor||"#0D1117";
  const firstName = org.assessor?.split(" ")[0]||null;
  const completed = assessments.filter(a=>a.status==="complete");
  const drafts    = assessments.filter(a=>a.status==="draft");
  const [tab, setTab]       = React.useState("all");
  const [search, setSearch] = React.useState("");

  const activeDraft = drafts[drafts.length-1];
  const draftAns    = activeDraft?.answers||{};

  const sectionStatus = FRA_SECTIONS.map(s=>{
    const vqs    = visibleQs(s,draftAns);
    const reqDone= vqs.filter(q=>q.required).every(q=>isAnswered(q,draftAns[q.ref]||{}));
    const anyDone= vqs.some(q=>isAnswered(q,draftAns[q.ref]||{}));

      hmo:         <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
      care_home:   <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 12h6M12 9v6"/></svg>,
      hotel:       <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><rect x="2" y="7" width="20" height="15" rx="1"/><path d="M2 12h20M7 7V5a5 5 0 0 1 10 0v2"/></svg>,
      higher_risk: <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><rect x="4" y="2" width="16" height="20" rx="1"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="16" y2="14"/></svg>,

          {/* ── Empty state ── */}
          {assessments.length===0&&(
            <div style={{textAlign:"center",padding:"40px 16px",borderRadius:14,border:"1.5px dashed #30363D",background:"#161B22"}}>
              <div style={{fontSize:40,marginBottom:14,opacity:.4}}>
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#8B949E" strokeWidth="1.2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>

                Start First Assessment

        </div>
      </div>
    </div>
  );
}
// ─── ASSESSMENT — card-by-card flow ──────────────────────────────
function Assessment({state, dispatch}) {
  const a = state.assessments.find(x=>x.id===state.activeId);
  if (!a) return <div style={{padding:40,textAlign:"center",color:"#6E7681"}}>Assessment not found. <button className="btn btn-ghost btn-sm" onClick={()=>dispatch({type:"GO",screen:"dashboard"})}>Back</button></div>;

  const {org, showMissed} = state;
  const ac = org.accentColor||"#C0392B";
  const pr = org.primaryColor||"#0D1117";
  const answers = a.answers||{};
  const secIdx  = a.secIdx||0;
  const qIdx    = a.qIdx||0;
  const mode    = a.mode||"card";   // "start" | "card" | "end" | "review"

  var preset = BUILDING_PRESETS[a.buildingPreset||"standard"]||BUILDING_PRESETS.standard;
  var presetSec = (preset.extraQuestions&&preset.extraQuestions.length>0) ? [{id:1.5,title:preset.label+" Requirements",short:"Preset",questions:preset.extraQuestions}] : [];
  var ALL_SECTIONS = [ASSESSOR_SECTION,SCOPE_SECTION].concat(FRA_SECTIONS).concat(presetSec).concat([VALIDATOR_SECTION,FINDINGS_SECTION]);

  const curSec  = ALL_SECTIONS[secIdx];
  const intro   = SECTION_INTROS[curSec.id];
  const advMode = a.advancedMode||false;
  const advDismissed = a.advancedDismissed||false;
  const vqs     = visibleQs(curSec, answers, advMode);  // skip-logic filtered

  const totalAnswered = ALL_SECTIONS.reduce((n,s)=>n+visibleQs(s,answers,advMode).filter(q=>isAnswered(q,answers[q.ref]||{})).length,0);
  const totalVisible  = ALL_SECTIONS.reduce((n,s)=>n+visibleQs(s,answers,advMode).length,0);
  const pct           = Math.round((totalAnswered/totalVisible)*100);
  const flagged       = Object.values(answers).filter(v=>v?.flagged).length;

  const allMissed = ALL_SECTIONS.flatMap(s=>
    visibleQs(s,answers,advMode).filter(q=>isMissed(q,answers[q.ref])).map(q=>({...q,secId:s.id}))
  );

  // Advanced mode trigger check
  const advTriggers = React.useMemo(()=>checkAdvancedTriggers(answers),[answers]);
  const [showAdvModal, setShowAdvModal] = React.useState(false);
  const prevTriggersRef = React.useRef(0);
  React.useEffect(()=>{
    if (advTriggers.length>0 && !advMode && !advDismissed && advTriggers.length > prevTriggersRef.current) {
      setShowAdvModal(true);
    }
    prevTriggersRef.current = advTriggers.length;
  },[advTriggers.length, advMode, advDismissed]);

  const secDone = s => visibleQs(s,answers,advMode).filter(q=>q.required).every(q=>isAnswered(q,answers[q.ref]||{}));
  const secMiss = s => visibleQs(s,answers,advMode).some(q=>isMissed(q,answers[q.ref]));
  const secAns  = s => visibleQs(s,answers,advMode).filter(q=>isAnswered(q,answers[q.ref]||{})).length;
  const secFlag = s => s.questions.filter(q=>answers[q.ref]?.flagged).length;

  const saveTimer = useRef(null);
  const [saveAnim, setSaveAnim] = useState(false);

  const setAns = useCallback((ref, patch) => {
    const now = new Date();
    const ts  = `${now.getHours()}:${String(now.getMinutes()).padStart(2,"0")}`;
    dispatch({type:"ANS", ref, patch, ts});
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(()=>{
      setSaveAnim(true);
      setTimeout(()=>setSaveAnim(false), 2000);
    }, 800);
  }, [dispatch]);

  const rememberPerson = name => dispatch({type:"REMEMBER_PERSON", name});

  // Navigation within card flow
  const [secFlash, setSecFlash] = useState(false);

  const goNextQ = () => {
    if (qIdx < vqs.length-1) {
      dispatch({type:"Q_IDX", i:qIdx+1});
    } else {
      // End of section — green flash celebration
      setSecFlash(true);
      setTimeout(() => { setSecFlash(false); dispatch({type:"SET_MODE", mode:"end"}); }, 700);
    }
  };

  const goPrevQ = () => {
    if (qIdx > 0) {
      dispatch({type:"Q_IDX", i:qIdx-1});
    } else if (secIdx > 0) {
      // Go back to end of previous section
      dispatch({type:"SEC", i:secIdx-1});
      dispatch({type:"SET_MODE", mode:"review"});
    }
  };

  const startSection = () => dispatch({type:"SET_MODE", mode:"card"});

  const goNextSec = () => {
    if (secIdx < ALL_SECTIONS.length-1) {
      dispatch({type:"SEC", i:secIdx+1});
      dispatch({type:"SET_MODE", mode:"start"});
    } else {
      dispatch({type:"SHOW_VALIDATION"});
    }
  };

  const curQ = vqs[qIdx];

  // Dot progress for section tabs
  const secProgress = (s) => {
    const vq = visibleQs(s, answers);
    const done = vq.filter(q=>isAnswered(q,answers[q.ref]||{})).length;
    return {done, total:vq.length};
  };

  // Advanced mode modal
  const AdvancedModal = showAdvModal && !advMode && (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.75)",zIndex:999,display:"flex",alignItems:"center",justifyContent:"center",padding:"20px"}}>
      <div style={{background:"#161B22",border:"1px solid #30363D",borderRadius:"16px",maxWidth:"380px",width:"100%",padding:"24px",boxShadow:"0 20px 60px rgba(0,0,0,.5)"}}>
        <div style={{display:"flex",alignItems:"center",gap:"10px",marginBottom:"16px"}}>
          <span style={{fontSize:"28px"}}>🔥</span>
          <div>
            <div style={{fontSize:"15px",fontWeight:700,color:"#F0F6FC"}}>Advanced Assessment Recommended</div>
            <div style={{fontSize:"11px",color:"#8B949E",marginTop:"2px"}}>Level 3-4 assessor depth</div>
          </div>
        </div>
        <div style={{fontSize:"12px",color:"#E6EDF3",lineHeight:"1.6",marginBottom:"14px"}}>
          Based on your answers, this building profile indicates an advanced assessment is appropriate:
        </div>
        <div style={{background:"#0D1117",borderRadius:"8px",padding:"10px 12px",marginBottom:"16px"}}>
          {advTriggers.map((t,i)=>(
            <div key={i} style={{fontSize:"11px",color:"#C0392B",display:"flex",gap:"6px",alignItems:"flex-start",marginBottom:i<advTriggers.length-1?"6px":0}}>
              <span style={{marginTop:"1px",flexShrink:0}}>⚠</span>
              <span>{t}</span>
            </div>
          ))}
        </div>
        <div style={{fontSize:"11px",color:"#8B949E",lineHeight:"1.55",marginBottom:"18px"}}>
          Advanced mode adds specialist questions covering BSA 2022, external wall systems, smoke control, cause-and-effect logic, fire loading and management system audit - matching PAS 79-1:2020 Level 3-4 competency requirements.
        </div>
        <div style={{display:"flex",gap:"10px"}}>
          <button
            onClick={()=>{dispatch({type:"SET_ADVANCED",v:true});setShowAdvModal(false);}}
            style={{flex:2,padding:"13px",background:"#C0392B",color:"#fff",border:"none",borderRadius:"10px",fontSize:"14px",fontWeight:700,cursor:"pointer",fontFamily:"Nunito,sans-serif"}}>
            Switch to Advanced
          </button>
          <button
            onClick={()=>{dispatch({type:"DISMISS_ADVANCED"});setShowAdvModal(false);}}
            style={{flex:1,padding:"13px",background:"#21262D",color:"#8B949E",border:"1px solid #30363D",borderRadius:"10px",fontSize:"13px",fontWeight:600,cursor:"pointer",fontFamily:"Nunito,sans-serif"}}>
            Keep Standard
          </button>
        </div>
      </div>
    </div>
  );

  return (
    <div className="assess-wrap">
      {/* Section complete flash */}
      {secFlash && <div style={{position:"fixed",inset:0,background:"#059669",opacity:.18,zIndex:999,pointerEvents:"none",animation:"secFlashAnim .7s ease both"}}/>}

      {/* Sticky top nav only — no intro banner sticking */}
      {AdvancedModal}
      <div className="assess-head">
        <div className="tnav dk" style={{background:pr}}>
          <button className="tn-back" onClick={()=>dispatch({type:"GO",screen:"dashboard"})}>← Back</button>
          <div className="tn-mid">
            <div className="tn-title dk" style={{fontSize:12}}>{a.premisesName||"Assessment"}</div>
            <div className="tn-sub">{a.ref}</div>
          </div>
          <span onClick={()=>{if(advMode){dispatch({type:"SET_ADVANCED",v:false});}else{setShowAdvModal(true);}}} title={advMode?"Click to switch to Standard mode":"Click to switch to Advanced mode"} style={{cursor:"pointer",fontSize:"10px",fontWeight:700,padding:"3px 9px",borderRadius:"20px",border:"1px solid "+(advMode?"#C0392B":"#30363D"),color:advMode?"#C0392B":"#6E7681",background:advMode?"rgba(192,57,43,.1)":"transparent",flexShrink:0,whiteSpace:"nowrap",userSelect:"none"}}>
            {advMode?"🔥 Advanced":"Standard"}
          </span>
          <div className="tn-save">
            {saveAnim
              ? <span style={{color:"#34D399",fontSize:9}}>● Saved</span>
              : a.savedAt ? <span style={{color:"rgba(255,255,255,.2)",fontSize:9}}>{a.savedAt}</span>
              : null}
          </div>
          {!state.isOnline && <span className="tn-offline">Offline</span>}
          {flagged>0&&mode==="card"&&(
            <span style={{fontSize:9,fontWeight:700,background:"#C0392B",color:"#fff",padding:"3px 8px",borderRadius:10}}>⚑{flagged}</span>
          )}
          {allMissed.length>0&&mode==="card"&&(
            <button style={{fontSize:9,fontWeight:600,background:"#DC262614",border:"1px solid #DC262633",color:"#DC2626",padding:"3px 8px",borderRadius:10,cursor:"pointer"}}
              onClick={()=>dispatch({type:"SHOW_MISSED"})}>⚠{allMissed.length}</button>
          )}
          {(() => {
            // Calculate current answer streak
            const streak = (() => {
              let s = 0;
              for (let i = vqs.length-1; i>=0; i--) {
                if (isAnswered(vqs[i], answers[vqs[i].ref]||{})) s++;
                else break;
              }
              return s;
            })();
            return streak>=5 ? (
              <span style={{fontSize:9,fontWeight:700,background:"#F59E0B22",border:"1px solid #F59E0B44",color:"#D97706",padding:"3px 8px",borderRadius:10}}>🔥{streak}</span>
            ) : null;
          })()}
        </div>

        {/* Section dot progress bar */}
        <div className="sec-dots-bar">
          <div className="sec-dot-row">
            {ALL_SECTIONS.map((s,i)=>{
              const done = secDone(s);
              const any  = secAns(s)>0;
              const active = secIdx===i;
              const {done:doneCount,total:totalQ} = secProgress(s);
              const fillPct = totalQ>0 ? (doneCount/totalQ) : 0;
              return (
                <div key={i} className="sec-dot-item"
                  style={{
                    flex:active?3:1,
                    background:done?"#059669":active?ac:any?`${ac}55`:"rgba(255,255,255,.12)",
                    cursor:"pointer",
                    opacity:active?1:.7,
                  }}
                  onClick={()=>{dispatch({type:"SEC",i});dispatch({type:"SET_MODE",mode:"start"});}}
                  title={s.title}/>
              );
            })}
          </div>
          <div className="sec-label-row">
            <span style={{color:ac,fontWeight:700,fontSize:10}}>{pct}%</span>
            <span style={{marginLeft:4}}>{secIdx+1}/{ALL_SECTIONS.length}</span>
          </div>
        </div>

        {/* Mobile section nav — visible on small screens */}
        <div className="mobile-sec-nav">
          <button className="msn-btn" onClick={()=>{if(secIdx>0){dispatch({type:"SEC",i:secIdx-1});dispatch({type:"SET_MODE",mode:"start"});}}} disabled={secIdx===0}>‹</button>
          <div className="msn-label">
            <span style={{color:ac,fontWeight:700}}>{curSec.short}</span>
            <span style={{color:"rgba(255,255,255,.3)",fontSize:9,marginLeft:6}}>{secIdx+1} / {ALL_SECTIONS.length}</span>
          </div>
          <button className="msn-btn" onClick={()=>{if(secIdx<ALL_SECTIONS.length-1){dispatch({type:"SEC",i:secIdx+1});dispatch({type:"SET_MODE",mode:"start"});}}} disabled={secIdx===ALL_SECTIONS.length-1}>›</button>
        </div>

        {/* Section tabs — scroll horizontally, compact (desktop) */}
        <div className="stabs">
          {ALL_SECTIONS.map((s,i)=>{
            const done  = secDone(s);
            const miss  = secMiss(s)&&showMissed;
            const active= secIdx===i;
            return (
              <button key={s.id} className={`stab ${active?"on":done?"done":miss?"miss":""}`}
                style={active?{borderBottomColor:ac}:{}}
                onClick={()=>{dispatch({type:"SEC",i});dispatch({type:"SET_MODE",mode:"start"});}}>
                {done&&!active?"✓ ":""}{s.short}
                {miss&&!active&&<span className="stab-miss-dot"/>}
              </button>
            );
          })}
        </div>
      </div>

      {/* Card area — touch swipe support */}
      <div className="card-area"
        onTouchStart={e=>{window._swipeX=e.touches[0].clientX;window._swipeY=e.touches[0].clientY;}}
        onTouchEnd={e=>{
          if(!window._swipeX)return;
          const dx=e.changedTouches[0].clientX-window._swipeX;
          const dy=Math.abs(e.changedTouches[0].clientY-window._swipeY);
          if(Math.abs(dx)>50&&dy<60&&mode==="card"){
            if(dx<0)goNextQ();
            else goPrevQ();
          }
          window._swipeX=null;
        }}
      >

        {/* ── SECTION START CARD ── */}
        {mode==="start" && (
          <div className="sec-start fade" style={{position:"relative"}}>
            <button style={{position:"absolute",top:12,left:12,padding:"6px 12px",borderRadius:8,border:"1px solid #30363D",background:"transparent",color:"#8B949E",fontSize:12,fontWeight:600,cursor:"pointer",display:"flex",alignItems:"center",gap:5,fontFamily:"'Nunito',sans-serif"}} onClick={()=>dispatch({type:"SEC",i:Math.max(0,secIdx-1)})}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="15 18 9 12 15 6"/></svg>Sections
            </button>
            <div className="ss-icon" style={{marginBottom:16}}><SecIcon name={intro?.icon||"clipboard"} size={44} color={intro?.colour||ac}/></div>
            <div className="ss-num" style={{color:intro?.colour||ac,marginBottom:6}}>Section {secIdx+1} of {ALL_SECTIONS.length}</div>
            <div className="ss-title">{curSec.title}</div>
            <div className="ss-desc">{intro?.text||""}</div>
            <div className="ss-meta">
              <span className="ss-pill">{vqs.length} question{vqs.length!==1?"s":""}</span>
              
              {secAns(curSec)>0&&<span className="ss-pill" style={{background:"rgba(5,150,105,.15)",color:"#34D399",borderColor:"rgba(52,211,153,.3)"}}>{secAns(curSec)} answered</span>}
            </div>
            <div style={{display:"flex",alignItems:"center",gap:12,justifyContent:"center",marginTop:8}}>
              {secIdx>0&&<button className="ss-prev-btn" onClick={()=>{playSound("click");dispatch({type:"SEC",i:secIdx-1});dispatch({type:"SET_MODE",mode:"end"});}}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="15 18 9 12 15 6"/></svg>
                Previous
              </button>}
              <button className="ss-begin" style={{background:pr}} onClick={()=>{playSound("whoosh");startSection();}}>
                {secAns(curSec)>0?"Continue →":"Begin →"}
              </button>
              {secIdx<ALL_SECTIONS.length-1&&<button className="ss-prev-btn" onClick={()=>{playSound("click");dispatch({type:"SEC",i:secIdx+1});}}>
                Skip
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="9 18 15 12 9 6"/></svg>
              </button>}
            </div>
          </div>
        )}

        {/* ── QUESTION CARD ── */}
        {mode==="card" && curQ && (
          <>
            <QuestionCard
              q={curQ}
              qIdx={qIdx}
              totalVisible={vqs.length}
              state={answers[curQ.ref]||{}}
              onChange={patch=>setAns(curQ.ref,patch)}
              onNext={goNextQ}
              onPrev={goPrevQ}
              showMissed={showMissed}
              sectionId={curSec.id}
              recentPersons={org.recentPersons||[]}
              onRememberPerson={rememberPerson}
            />
            <div className="q-footer">
              <button className="q-prev" onClick={()=>{playSound("click");goPrevQ();}} disabled={secIdx===0&&qIdx===0} title="Previous"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><polyline points="15 18 9 12 15 6"/></svg></button>
              {isAnswered(curQ,answers[curQ.ref]||{}) ? (
                <button className="q-next" style={{background:ac}} onClick={()=>{playSound("click");goNextQ();}}>
                  {qIdx<vqs.length-1?<span style={{display:"flex",alignItems:"center",gap:6,justifyContent:"center"}}>Next<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><polyline points="9 18 15 12 9 6"/></svg></span>:<span style={{display:"flex",alignItems:"center",gap:6,justifyContent:"center"}}>Complete Section ✓</span>}
                </button>
              ) : (
                <button className="q-next q-next-skip" onClick={()=>{playSound("click");goNextQ();}}>Continue →</button>
              )}
            </div>
          </>
        )}

        {/* ── SECTION END CARD ── */}
        {mode==="end" && (
          <div className="sec-end fade" style={{position:"relative"}}>
            <button style={{position:"absolute",top:12,left:12,padding:"6px 12px",borderRadius:8,border:"1px solid #30363D",background:"transparent",color:"#8B949E",fontSize:12,fontWeight:600,cursor:"pointer",display:"flex",alignItems:"center",gap:5,fontFamily:"'Nunito',sans-serif"}} onClick={()=>{playSound("click");dispatch({type:"GO",screen:"dashboard"});}}>\n              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="15 18 9 12 15 6"/></svg>Dashboard
            </button>
            <div className="se-icon" style={{color:secDone(curSec)?"#059669":"#8B949E"}}>{secDone(curSec)?<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>:<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>}</div>
            <div className="se-title" style={{color:secDone(curSec)?"#059669":"#F0F6FC"}}>{secDone(curSec)?`${curSec.title} ✓`:`${curSec.title}`}</div>
            <div className="se-sub">
              {curSec.title}<br/>
              {secAns(curSec)} of {vqs.length} questions answered
              {secFlag(curSec)>0&&` · ${secFlag(curSec)} flagged`}
            </div>
            <div className="se-stats">
              <span className="se-stat" style={{background:"#0D3321",color:"#059669"}}>✓ {secAns(curSec)} answered</span>
              {secFlag(curSec)>0&&<span className="se-stat" style={{background:"rgba(192,57,43,.12)",color:"#E8773A",border:"1px solid rgba(192,57,43,.25)"}}>🚩 {secFlag(curSec)} flagged</span>}
              {secDone(curSec)&&<span className="se-stat" style={{background:"#0D3321",color:"#059669",fontWeight:700}}>Section complete ✓</span>}
              {secMiss(curSec)&&<span className="se-stat" style={{background:"#FEF2F2",color:"#DC2626"}}>⚠ {visibleQs(curSec,answers).filter(q=>isMissed(q,answers[q.ref])).length} missing</span>}
            </div>
            <button className="se-next" onClick={()=>{playSound("whoosh");goNextSec();}}>
              {secIdx<ALL_SECTIONS.length-1?`Start ${ALL_SECTIONS[secIdx+1].title}`:"Complete Assessment →"}
            </button>
            <button className="se-review" onClick={()=>{playSound("click");dispatch({type:"SET_MODE",mode:"review"});}}>
              Review this section
            </button>
          </div>
        )}

        {/* ── REVIEW MODE ── */}
        {mode==="review" && (
          <>
            <div style={{padding:"12px 16px",background:"#161B22",borderBottom:"1px solid #30363D",display:"flex",alignItems:"center",gap:10,position:"sticky",top:0}}>
              <div style={{fontFamily:"'Nunito',sans-serif",fontSize:16,fontWeight:700,flex:1}}>{curSec.title} — Review</div>
              <button className="btn btn-ghost btn-sm" onClick={()=>dispatch({type:"SET_MODE",mode:"end"})}>Done reviewing</button>
            </div>
            <div className="review-mode">
              {vqs.map((q,i)=>{
                const ans = answers[q.ref];
                const answered = isAnswered(q,ans||{});
                const missed   = isMissed(q,ans);
                const flaggedQ = ans?.flagged;
                return (
                  <div key={q.ref} className="review-q"
                    onClick={()=>{dispatch({type:"Q_IDX",i});dispatch({type:"SET_MODE",mode:"card"});}}>
                    <span className="rq-ref">{q.ref}</span>
                    <span className="rq-text">{q.q.length>80?q.q.slice(0,80)+"…":q.q}</span>
                    {missed ? <span className="rq-ans miss">⚠ Required</span>
                    : flaggedQ ? <span className="rq-ans flag">⚑ Flagged</span>
                    : ans?.ans==="y" ? <span className="rq-ans y">Yes</span>
                    : ans?.ans==="n" ? <span className="rq-ans n">No</span>
                    : ans?.ans==="na" ? <span className="rq-ans na">N/A</span>
                    : ans?.sel?.length>0 ? <span className="rq-ans y">{ans.sel.length} selected</span>
                    : ans?.ans ? <span className="rq-ans y">Answered</span>
                    : <span style={{fontSize:10,color:"#8B949E"}}>—</span>}
                  </div>
                );
              })}
            </div>
          </>
        )}
      </div>

      {/* Validation modal */}
      {state.showValidation && (
        <div className="modal-ov" onClick={()=>dispatch({type:"GO",screen:"assessment"})}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="modal-h">
              <span className="modal-t">{allMissed.length>0?"Incomplete Questions":"Complete Assessment"}</span>
              <button className="modal-x" onClick={()=>dispatch({type:"GO",screen:"assessment"})}>✕</button>
            </div>
            <div className="modal-b">
              {allMissed.length>0 ? (
                <div style={{display:"flex",gap:9,padding:"11px 13px",background:"#FEF2F2",border:"1px solid #FECACA",borderRadius:8,marginBottom:12}}>
                  <span style={{fontSize:15,flexShrink:0}}>⚠</span>
                  <div>
                    <div style={{fontWeight:600,fontSize:12,color:"#991B1B",marginBottom:3}}>{allMissed.length} required question{allMissed.length>1?"s":""} unanswered</div>
                    <div style={{fontSize:11,color:"#B91C1C",lineHeight:1.6}}>These may affect the defensibility of your report under the RRO 2005.</div>
                  </div>
                </div>
              ) : (
                <p style={{fontSize:13,color:"#374151",lineHeight:1.65,marginBottom:12}}>All required questions answered. Ready to generate your report.</p>
              )}
            </div>
            <div className="modal-f">
              <button className="btn btn-ghost btn-sm" onClick={()=>dispatch({type:"GO",screen:"assessment"})}>
                {allMissed.length>0?"Go back":"Cancel"}
              </button>
              <button className="btn btn-teal btn-sm" onClick={()=>{
                const riskAns = a.answers?.["OR.3"]?.ans;
                const nextRev = a.answers?.["OR.4"]?.ans;
                dispatch({type:"COMPLETE",ts:fmtDate(new Date().toISOString()),riskRating:riskAns,nextReview:nextRev});
              }}>
                {allMissed.length>0?"Generate anyway →":"Generate Report →"}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}
// ─── PDF GENERATOR ────────────────────────────────────────────────
// Uses browser print API with dedicated print window
// Works on all mobile browsers — no external dependencies

function generatePDF(a, org) {
  const answers    = a.answers || {};
  const ac         = org.accentColor  || "#0D7A7A";
  const pr         = org.primaryColor || "#0D1117";
  const risk       = a.riskRating || "";

  const actionItems = Object.entries(answers)
    .filter(([,v]) => v?.flagged)
    .map(([ref,v]) => {
      const q = ALL_PDF_SECTIONS_BASE.flatMap(s=>s.questions).find(q=>q.ref===ref);
      return {
        ref, text:q?.q||"",
        action:    v.action||"",
        priority:  v.priority||"P3 — Within 3 months",
        responsible: v.responsible||"",
        targetDate:  v.targetDate||"",
        actionStatus:v.actionStatus||"pending",
        photos:    v.photos||[],
        note:      v.note||"",
      };
    });

  const allPhotos = Object.entries(answers).flatMap(([ref,v]) =>
    (v?.photos||[]).map(p => ({
      ...p, ref,
      questionText: ALL_PDF_SECTIONS_BASE.flatMap(s=>s.questions).find(q=>q.ref===ref)?.q||""
    }))
  );

  const positiveFindings = Object.entries(answers)
    .filter(([,v]) => v?.ans==="y" && v?.note && v.note.trim())
    .map(([ref,v]) => ({
      ref,
      note: v.note,
      text: ALL_PDF_SECTIONS_BASE.flatMap(s=>s.questions).find(q=>q.ref===ref)?.q||""
    }))
    .slice(0, 10);

  const pColor = p =>
    p?.includes("P1") ? "#B91C1C" :
    p?.includes("P2") ? "#D97706" :
    p?.includes("P3") ? "#0D7A7A" : "#059669";

  const rCol = r =>
    r?.startsWith("Critical") ? "#B91C1C" :
    r?.startsWith("High")     ? "#D97706" :
    r?.startsWith("Medium")   ? "#D97706" : "#059669";

  const secsDone = FRA_SECTIONS.filter(s =>
    s.questions.filter(q=>q.required).every(q=>isAnswered(q,(answers)[q.ref]||{}))
  ).length;

  const execSummary =
    "This fire risk assessment was carried out at " +
    (a.premisesName||"the premises") + " on " + fmtDate(a.assessmentDate) +
    " by " + (org.assessor||"the assessor") + (org.quals ? " (" + org.quals + ")" : "") +
    ". The assessment covered " + secsDone + " of " + FRA_SECTIONS.length +
    " sections in accordance with the Regulatory Reform (Fire Safety) Order 2005." +
    " The overall fire risk rating assigned to these premises is " +
    (risk ? risk.split("—")[0].trim() : "not yet set") + "." +
    " A total of " + actionItems.length + " significant finding" +
    (actionItems.length !== 1 ? "s were" : " was") + " identified during the assessment" +
    (actionItems.filter(x=>x.priority?.includes("P1")).length > 0
      ? ", of which " + actionItems.filter(x=>x.priority?.includes("P1")).length +
        " require" + (actionItems.filter(x=>x.priority?.includes("P1")).length === 1 ? "s" : "") +
        " immediate action"
      : "") + "." +
    (positiveFindings.length > 0
      ? " A number of positive fire safety arrangements were also observed." : "") +
    " The Responsible Person is advised to implement all recommended actions within the timescales specified in the Action Plan.";

  // Photo to data URL (already base64 from camera capture)

if(navigator.share){
navigator.share({title:title,text:text,url:window.location.href}).catch(function(e){if(e.name!=="AbortError")console.warn(e);});
}else if(navigator.clipboard){

}
